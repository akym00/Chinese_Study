  </section>
  <section class="panel"><h2>방</h2>
    <p class="hint">방에 들어간 사람끼리만 서로의 점검 점수와 진척을 볼 수 있습니다. 방을 만들면 나오는 코드를 친구에게 알려 주세요.</p>
    <div class="cl-inline"><input id="rm-name" maxlength="20" placeholder="새 방 이름"><button id="rm-new" class="primary">방 만들기</button></div>
    <div class="cl-inline"><input id="rm-code" maxlength="6" placeholder="방 코드 6자리" autocapitalize="characters"><button id="rm-join">들어가기</button></div>
    <p class="build-msg" id="rm-msg"></p>
    <div id="rm-list"></div>
  </section>
  ${CLOUD.isAdmin ? '<section class="panel"><h2>관리자: 사용 이력</h2><div id="cl-admin"><p class="muted">불러오는 중…</p></div><div id="cl-events"></div></section>' : ''}`;
  document.getElementById('cl-out').onclick = async () => { await CLOUD.auth.signOut(); renderCloud(); };
  document.getElementById('cl-sync').onclick = async () => {
    const st = document.getElementById('cl-status'); st.textContent = '저장 중…';
    await cloudPush(null);
    st.textContent = CLOUD.err ? cloudErrText(CLOUD.err) : '저장했습니다.';
    CLOUD.cache = {}; loadBoard(tk);
  };
  CLOUD.cache = {};
  drawRooms(tk); drawScope(tk); loadBoard(tk);
  document.querySelectorAll('#rk-sort button').forEach((b) => { b.onclick = () => { CLOUD.sort = b.dataset.s; drawScope(tk); loadBoard(tk); }; });
  const msg = (t, cls) => { const m = document.getElementById('rm-msg'); if (m) { m.textContent = t; m.className = 'build-msg ' + (cls || ''); } };
  document.getElementById('rm-new').onclick = async () => {
    const name = document.getElementById('rm-name').value.trim();
    if (!name) return msg('방 이름을 적어 주세요.', 'bad');
    msg('만드는 중…');
    try {
      let code = '';
      for (let t = 0; t < 6 && !code; t++) { const c = roomCode(); if (!(await CLOUD.db.doc(`rooms/${c}`).get()).exists) code = c; }
      if (!code) return msg('잠시 후 다시 시도해 주세요.', 'bad');
      await CLOUD.db.doc(`rooms/${code}`).set({ name, owner: u.uid, ownerName: myName, created: Date.now() });
      await cloudJoinRoom(code, name);
      CLOUD.scope = 'room:' + code; CLOUD.cache = {};
      msg(`'${name}' 방을 만들었습니다. 코드: ${code}`, 'good');
      document.getElementById('rm-name').value = '';
      drawRooms(tk); drawScope(tk); loadBoard(tk);
    } catch (e) { msg(cloudErrText(e), 'bad'); }
  };
  document.getElementById('rm-join').onclick = async () => {
    const code = document.getElementById('rm-code').value.trim().toUpperCase();
    if (code.length !== 6) return msg('방 코드는 6자리입니다.', 'bad');
    if (CLOUD.rooms[code]) return msg('이미 들어간 방입니다.', 'bad');
    msg('확인 중…');
    try {
      const snap = await CLOUD.db.doc(`rooms/${code}`).get();
      if (!snap.exists) return msg('없는 방 코드입니다.', 'bad');
      const name = snap.data().name || code;
      await cloudJoinRoom(code, name);
      CLOUD.scope = 'room:' + code; CLOUD.cache = {};
      msg(`'${name}' 방에 들어왔습니다.`, 'good');
      document.getElementById('rm-code').value = '';
      drawRooms(tk); drawScope(tk); loadBoard(tk);
    } catch (e) { msg(cloudErrText(e), 'bad'); }
  };
  if (CLOUD.isAdmin) loadAdmin(tk);
}

function drawRooms(tk) {
  const box = document.getElementById('rm-list'); if (!box) return;
  const ks = Object.keys(CLOUD.rooms);
  box.innerHTML = ks.length ? ks.map((k) => `<div class="room-row"><b>${esc(CLOUD.rooms[k])}</b><span class="room-code">${k}</span>
    <button class="icon" data-copy="${k}">코드 복사</button><button class="icon" data-leave="${k}">나가기</button></div>`).join('') : '<p class="muted">아직 들어간 방이 없습니다.</p>';
  box.querySelectorAll('[data-copy]').forEach((b) => { b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('코드를 복사했습니다', 'good'); } catch (e) { toast('코드: ' + b.dataset.copy); } }; });
  box.querySelectorAll('[data-leave]').forEach((b) => {
    b.onclick = async () => {
      const k = b.dataset.leave;
      if (!(await askConfirm(`'${CLOUD.rooms[k]}' 방에서 나갈까요?\n나가면 이 방의 순위에서 빠집니다.`))) return;
      try {
        await CLOUD.db.doc(`rooms/${k}/members/${CLOUD.user.uid}`).delete();
        await CLOUD.db.doc(`private/${CLOUD.user.uid}/rooms/${k}`).delete();
        delete CLOUD.rooms[k]; CLOUD.cache = {};
        if (CLOUD.scope === 'room:' + k) CLOUD.scope = 'all';
        drawRooms(tk); drawScope(tk); loadBoard(tk);
      } catch (e) { toast(cloudErrText(e), 'bad'); }
    };
  });
}

function drawScope(tk) {
  const box = document.getElementById('rk-scope'); if (!box) return;
  const L = LV(levelOfCursor(S.cursor));
  const items = [['all', '🌏 전체'], ['level', `${L.icon} ${L.name} 레벨`], ...Object.keys(CLOUD.rooms).map((k) => ['room:' + k, '🏠 ' + CLOUD.rooms[k]])];
  if (!items.some((x) => x[0] === CLOUD.scope)) CLOUD.scope = 'all';
  box.innerHTML = items.map(([k, t]) => `<button data-sc="${esc(k)}" class="${k === CLOUD.scope ? 'on' : ''}">${esc(t)}</button>`).join('');
  box.querySelectorAll('button').forEach((b) => { b.onclick = () => { CLOUD.scope = b.dataset.sc; drawScope(tk); loadBoard(tk); }; });
  document.querySelectorAll('#rk-sort button').forEach((b) => b.classList.toggle('on', b.dataset.s === CLOUD.sort));
}

async function loadBoard(tk) {
  const box = document.getElementById('cl-board'); if (!box) return;
  const scope = CLOUD.scope, sort = CLOUD.sort;
  try {
    CLOUD.cache = CLOUD.cache || {};
    const isRoom = scope.startsWith('room:');
    const key = isRoom ? scope : 'all';
    if (!CLOUD.cache[key]) {
      const snap = await CLOUD.db.collection(isRoom ? `rooms/${scope.slice(5)}/members` : 'public').get();
      const rows = []; snap.forEach((d) => rows.push({ id: d.id, ...d.data() })); CLOUD.cache[key] = rows;
    }
    if (tk !== viewToken || !document.getElementById('cl-board') || scope !== CLOUD.scope || sort !== CLOUD.sort) return;
    const myLv = levelOfCursor(S.cursor);
    let rows = CLOUD.cache[key].map((r) => ({ ...r, lv: levelOfCursor(r.cursor || 0) }));
    if (scope === 'level') rows = rows.filter((r) => r.lv === myLv);
    const sv = (r) => (sort === 'score' ? (r.score == null ? -1 : r.score) : (r.cursor || 0));
    rows.sort((a, b) => sv(b) - sv(a) || (b.cursor || 0) - (a.cursor || 0) || String(a.name).localeCompare(String(b.name)));
    const mine = rows.findIndex((r) => CLOUD.user && r.id === CLOUD.user.uid);
    const me = document.getElementById('rk-me');
    const label = sort === 'score' ? '성적' : '진척율';
    if (me) me.textContent = mine >= 0 ? `내 ${label} 순위: ${rows.length}명 중 ${mine + 1}위` : `${rows.length}명`;
    const detail = isRoom;
    box.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>이름</th><th>레벨</th><th>진척률</th><th>완료</th><th>성적</th><th>연속</th>${detail ? '<th>주간 점검</th>' : ''}<th>최근 학습</th></tr></thead><tbody>
      ${rows.map((r, i) => { const Lr = LV(r.lv); const ck = Object.entries(r.checks || {}).sort((a, b) => a[0] - b[0]).map(([w, s]) => `${w}주 ${s}`).join(', ') || '-';
        return `<tr class="${CLOUD.user && r.id === CLOUD.user.uid ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.name || '-')}</td><td title="${Lr.name}">${Lr.icon} ${Lr.name}</td><td>${r.pct ?? 0}%</td><td>${r.cursor ?? 0}일차</td><td>${r.score == null ? '-' : r.score}</td><td>${r.streak ?? 0}일</td>${detail ? `<td>${esc(ck)}</td>` : ''}<td>${esc(r.last || '-')}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="muted">아직 해당하는 학습자가 없습니다.</p>';
  } catch (e) { box.innerHTML = `<p class="build-msg bad">${esc(cloudErrText(e))}</p>`; }
}

async function loadAdmin(tk) {
  const box = document.getElementById('cl-admin'); if (!box) return;
  try {
    const snap = await CLOUD.db.collection('private').get();
    if (tk !== viewToken || !document.getElementById('cl-admin')) return;
    const rows = []; snap.forEach((d) => rows.push({ id: d.id, ...d.data() }));
    rows.sort((a, b) => (b.cursor || 0) - (a.cursor || 0));
    box.innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th><th>이메일</th><th>레벨</th><th>진척</th><th>학습일</th><th>주간 점검 점수</th><th></th></tr></thead><tbody>
      ${rows.map((r) => {
        const ck = Object.entries(r.checks || {}).sort((a, b) => a[0] - b[0]).map(([w, s]) => `${w}주 ${s}`).join(', ') || '-';
        return `<tr><td>${esc(r.name || '-')}</td><td>${esc(r.email || '-')}</td><td>${LV(levelOfCursor(r.cursor || 0)).icon} ${LV(levelOfCursor(r.cursor || 0)).name}</td><td>${r.pct ?? 0}% (${r.cursor ?? 0}일차)</td><td>${r.studyDays ?? 0}일</td><td>${esc(ck)}</td><td><button class="icon" data-ev="${esc(r.id)}" data-nm="${esc(r.name || r.email || '')}">이력</button></td></tr>`;
      }).join('')}</tbody></table></div>` : '<p class="muted">데이터가 없습니다.</p>';
    box.querySelectorAll('[data-ev]').forEach((b) => { b.onclick = () => showEvents(b.dataset.ev, b.dataset.nm, tk); });
  } catch (e) { box.innerHTML = `<p class="build-msg bad">${esc(cloudErrText(e))}</p>`; }
}

async function showEvents(uid, name, tk) {
  const box = document.getElementById('cl-events'); if (!box) return;
  box.innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    const snap = await CLOUD.db.collection(`private/${uid}/events`).orderBy('at', 'desc').limit(60).get();
    if (tk !== viewToken || !document.getElementById('cl-events')) return;
    const rows = []; snap.forEach((d) => rows.push(d.data()));
    box.innerHTML = `<h3>${esc(name)}님의 최근 이력</h3>` + (rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>시각</th><th>구분</th><th>주차·일차</th><th>점수</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${fmtTime(r.at)}</td><td>${esc(KIND_LABEL[r.kind] || r.kind || '-')}</td><td>${r.week ? `${r.week}주차${r.dayNo ? ' ' + r.dayNo + '일차' : ''}` : '-'}</td><td>${r.score != null ? esc(r.score) + '점' : '-'}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">이력이 없습니다.</p>');
  } catch (e) { box.innerHTML = `<p class="build-msg bad">${esc(cloudErrText(e))}</p>`; }
}

// 설정이 있으면 시작할 때 미리 연결(로그인 유지 확인)
if (cloudConfigured()) setTimeout(() => { initCloud().catch(() => {}); }, 500);

</script>
</body>
</html>
