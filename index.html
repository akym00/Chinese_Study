      "py": "Zhēn hǎo. Nǐ míngnián yǒu shénme dǎsuàn?",
      "ko": "좋네요. 내년에 무슨 계획 있어요?"
    },
    {
      "sp": "B",
      "zh": "我打算去北京旅游。只要有空，我就想去长城看看。",
      "py": "Wǒ dǎsuàn qù Běijīng lǚyóu. Zhǐyào yǒu kòng, wǒ jiù xiǎng qù Chángchéng kànkan.",
      "ko": "베이징으로 여행 갈 계획이에요. 시간만 나면 만리장성에 가 보고 싶어요."
    }
  ]
}
};
</script>
<script>
'use strict';

/* ============ 설정 ============ */
const STORE_KEY = 'cn-study-v1';
const TOTAL_WEEKS = 104;
const PEN_GREEN = '#1f9d47'; // 한자 쓰기 펜 색
const DAYS_PER_WEEK = 6;   // 주 6일 학습 (나머지 하루는 쉬는 날)
const TOTAL_SESSIONS = TOTAL_WEEKS * DAYS_PER_WEEK;
const STATE_VER = 2;       // 1 = 주 7일 구조, 2 = 주 6일 구조
const INTERVALS = [0, 1, 2, 4, 8, 16, 32]; // 복습 간격(일), 상자 번호 = 인덱스
const REC_MAX_MS = 60000; // 한 번에 녹음할 수 있는 최대 시간
const DAY_TYPES = [
  { id: 'words1', label: '단어 ①' },
  { id: 'words2', label: '단어 ②' },
  { id: 'sentences', label: '핵심 문장' },
  { id: 'grammar', label: '문법 + 대화 + 롤플레이' },
  { id: 'review', label: '복습 퀴즈 + 확장 코너' },
  { id: 'check', label: '주간 점검 · 문장 만들기' },
];

const app = document.getElementById('app');
const cache = {};

/* ============ 툴팁 (마우스를 올리면 즉시 표시) ============ */
const tipEl = document.createElement('div');
tipEl.id = 'tip';
document.body.appendChild(tipEl);

function showTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  tipEl.textContent = text;
  tipEl.classList.add('on');
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8)); // 화면 밖으로 안 나가게
  let top = r.top - h - 8;
  if (top < 8) top = r.bottom + 8; // 위쪽 공간이 없으면 아래에 표시
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}
function hideTip() {
  tipEl.classList.remove('on');
}
let S = loadState();
let session = null;
let curriculum = null;
// 화면 전환마다 1씩 올립니다. 느리게 끝난 이전 화면의 비동기 그리기가 새 화면을 덮어쓰지 않게 막는 표식입니다.
let viewToken = 0;

/* ============ 유틸 ============ */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const weekOf = (cursor) => Math.floor(cursor / DAYS_PER_WEEK) + 1;
const dayOf = (cursor) => cursor % DAYS_PER_WEEK;
const weekPath = (n) => `data/week-${String(n).padStart(3, '0')}.json`;

function todayStr(d = new Date()) {
  return d.toLocaleDateString('sv-SE'); // YYYY-MM-DD (로컬 시간대)
}
function addDays(str, n) {
  const d = new Date(str + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return todayStr(d);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
async function getJSON(path) {
  if (path in cache) return cache[path];
  // 단일 파일 버전: 내장 데이터(window.CN_DATA)가 있으면 fetch 없이 사용
  if (window.CN_DATA) {
    cache[path] = window.CN_DATA[path] || null;
    return cache[path];
  }
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status);
    cache[path] = await r.json();
  } catch (e) {
    cache[path] = null;
  }
  return cache[path];
}

/* ============ 저장 상태 ============ */
function defaultState() {
  // cursor: 완료한 학습 세션 수 (이걸로 주차/요일을 계산 → 하루 빠져도 진도가 밀리지 않음)
  // progress: 오늘 학습에서 완료한 단계 {cursor, done:[kind...]} (나갔다 와도 이어서 학습)
  return { ver: STATE_VER, cursor: 0, completed: {}, srs: {}, checks: {}, progress: null, pen: { w: 'normal', mode: 'order' } };
}
// 주 7일 구조(ver 1)로 저장된 진도를 주 6일 구조로 변환한다.
// 예전 4일차(문법+대화 듣기)→새 4일차에 롤플레이가 추가돼 그대로 4일차,
// 예전 5일차(롤플레이)는 4일차로 흡수, 6일차(복습)→5일차, 7일차(점검)→6일차.
function migrateState(st) {
  if (!st || st.ver === STATE_VER) return st;
  const old = Number(st.cursor) || 0;
  const wk = Math.floor(old / 7), d = old % 7;
  const nd = [0, 1, 2, 3, 3, 4, 5][d];
  st.cursor = Math.min(wk * DAYS_PER_WEEK + nd, TOTAL_SESSIONS);
  const pr = st.progress;
  if (pr && pr.cursor === old) {
    let done = (pr.done || []).slice();
    if (d === 4) done = ['grammar', 'dialogue'].concat(done.includes('speak') ? ['speak'] : []);
    st.progress = { cursor: st.cursor, done };
  } else st.progress = null;
  st.ver = STATE_VER;
  return st;
}
function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    return Object.assign(defaultState(), migrateState(raw));
  } catch (e) {
    return defaultState();
  }
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
  } catch (e) { /* 저장 실패는 무시 */ }
}
function streak() {
  let d = todayStr();
  if (!S.completed[d]) d = addDays(d, -1);
  let n = 0;
  while (S.completed[d]) { n++; d = addDays(d, -1); }
  return n;
}
const stageOf = (w) => curriculum.stages.find((s) => w >= s.from && w <= s.to);

/* ============ 레벨 (학습 단계 = 레벨) ============ */
const LEVEL_STYLE = [
  { name: '입문', icon: '🌱', color: '#2e9d4f', tint: '#dcf3e2' },
  { name: '초급', icon: '🌿', color: '#1d7fd1', tint: '#dbeafb' },
  { name: '중급', icon: '🌳', color: '#7b4fc9', tint: '#ebe1fa' },
  { name: '중고급', icon: '🔥', color: '#e07b1a', tint: '#fde8d2' },
  { name: '고급', icon: '👑', color: '#c8102e', tint: '#fbdde2' },
];
const levelIdxOfWeek = (w) => Math.max(0, curriculum.stages.findIndex((s) => w >= s.from && w <= s.to));
const levelOfCursor = (c) => levelIdxOfWeek(Math.min(TOTAL_WEEKS, weekOf(c)));
const LV = (i) => Object.assign({ i }, curriculum.stages[i] || {}, LEVEL_STYLE[i] || LEVEL_STYLE[0]);

/* ============ 간격 반복(SRS) ============ */
function dueCards() {
  const t = todayStr();
  return Object.entries(S.srs)
    .filter(([, c]) => c.due <= t)
    .sort((a, b) => a[1].due.localeCompare(b[1].due))
    .slice(0, 12)
    .map(([zh, c]) => ({ zh, ...c }));
}
function grade(item, ok) {
  const c = S.srs[item.zh];
  if (!c) return;
  c.box = ok ? Math.min(c.box + 1, INTERVALS.length - 1) : 0;
  c.due = addDays(todayStr(), INTERVALS[c.box]);
  save();
}

/* ============ 음성 (듣기 / 음성 인식) ============ */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  speechSynthesis.speak(u);
}
function listen(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return cb(null, '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 권장합니다.');
  const r = new SR();
  r.lang = 'zh-CN';
  r.onresult = (e) => cb(e.results[0][0].transcript);
  r.onerror = (e) => cb(null, '인식 오류: ' + e.error);
  r.start();
}
const norm = (s) => s.replace(/[\s，。！？、,.!?]/g, '');
function similarity(heard, target) {
  const A = norm(heard), B = norm(target);
  if (!B) return 0;
  let hit = 0;
  for (const ch of B) if (A.includes(ch)) hit++;
  return hit / B.length;
}

/* ============ 녹음 저장소 (IndexedDB) ============ */
function withStore(mode, fn) {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('indexedDB 미지원'));
    const open = indexedDB.open('cn-study-rec', 1);
    open.onupgradeneeded = () => { open.result.createObjectStore('recs', { keyPath: 'id', autoIncrement: true }); };
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const db = open.result;
      const tx = db.transaction('recs', mode);
      let result;
      const req = fn(tx.objectStore('recs'));
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => { db.close(); resolve(result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
      tx.onabort = () => { db.close(); reject(tx.error); };
    };
  });
}
const saveRec = (rec) => withStore('readwrite', (s) => s.add(rec));
const listRecs = () => withStore('readonly', (s) => s.getAll());
const deleteRec = (id) => withStore('readwrite', (s) => s.delete(id));

// 앱 안에서 뜨는 확인창. (일부 휴대폰 앱·미리보기 화면은 기본 confirm()을 막기 때문)
const nativeConfirm = window.confirm;
function askConfirm(msg) {
  if (window.confirm !== nativeConfirm) return Promise.resolve(window.confirm(msg));   // 테스트용 대체
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p class="modal-msg"></p>
      <div class="row"><button type="button" data-no>취소</button><button type="button" class="primary" data-ok>확인</button></div></div>`;
    ov.querySelector('.modal-msg').textContent = msg;
    const end = (v) => { ov.remove(); resolve(v); };
    ov.querySelector('[data-ok]').onclick = () => end(true);
    ov.querySelector('[data-no]').onclick = () => end(false);
    document.body.appendChild(ov);
    ov.querySelector('[data-ok]').focus();
  });
}
// 화면 가운데에 잠깐 뜨는 알림 (정답/오답 안내)
function toast(msg, kind) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'good' ? 800 : 1200);
}
const blobToDataURL = (blob) => new Promise((res, rej) => {
  const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob);
});
// 브라우저가 저장 공간 부족 시 기록을 임의로 지우지 않도록 영구 저장 요청 (지원/허용될 때만)
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }

/* ============ 녹음 (MediaRecorder) ============ */
const REC = { active: null, timer: null };

function recMsg(line, text) {
  const m = line && line.querySelector('.mic-result');
  if (m) m.textContent = text;
}

async function toggleRec(btn) {
  const line = btn.closest('.line');
  if (REC.active) {
    const same = REC.active.btn === btn;
    await stopRec();
    if (same) return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    recMsg(line, '이 브라우저는 녹음을 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.');
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    recMsg(line, '마이크를 사용할 수 없습니다. 주소창의 마이크 권한을 허용했는지 확인하세요.');
    return;
  }
  const chunks = [];
  const t0 = Date.now();
  const mr = new MediaRecorder(stream);
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise((resolve) => {
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearTimeout(REC.timer);
      const ms = Date.now() - t0;
      btn.textContent = '⏺ 녹음';
      btn.classList.remove('recording');
      REC.active = null;
      if (chunks.length) {
        try {
          await saveRec({
            week: +line.dataset.lw,
            zh: line.dataset.zh,
            created: Date.now(),
            ms,
            blob: new Blob(chunks, { type: mr.mimeType || 'audio/webm' }),
          });
          recMsg(line, '저장했습니다. 아래에서 다시 들어 보세요.');
        } catch (e) {
          recMsg(line, '저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.');
        }
      } else {
        recMsg(line, '녹음된 소리가 없습니다. 다시 시도해 주세요.');
      }
      refreshRecUI();
      resolve();
    };
  });
  mr.start();
  REC.active = { btn, mr, done };
  btn.textContent = '⏹ 정지';
  btn.classList.add('recording');
  recMsg(line, '녹음 중… 문장을 읽고 ⏹ 정지를 누르세요. (최대 60초)');
  REC.timer = setTimeout(stopRec, REC_MAX_MS);
}

function stopRec() {
  const a = REC.active;
  if (!a) return Promise.resolve();
  a.mr.stop();
  return a.done;
}

function refreshRecUI() {
  if (document.getElementById('recview')) renderRecordings();
  else hydrateRecs();
}

function recItemHTML(r) {
  const url = URL.createObjectURL(r.blob);
  const type = r.blob.type || '';
  const ext = /mp4/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm';
  const when = new Date(r.created).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<div class="rec" data-id="${r.id}">
    <audio controls preload="none" src="${url}"></audio>
    <span class="muted small">${esc(when)} · ${(r.ms / 1000).toFixed(1)}초</span>
    <a class="icon dl" href="${url}" download="week${r.week}-${r.id}.${ext}" title="파일로 저장">⬇</a>
    <button class="icon" data-delrec="${r.id}" title="삭제">🗑</button>
  </div>`;
}

// 화면에 보이는 문장들 아래에 저장된 녹음(최근 3개)을 채운다
async function hydrateRecs() {
  const lines = app.querySelectorAll('.line[data-lw]');
  if (!lines.length) return;
  let all;
  try { all = await listRecs(); } catch (e) { return; }
  lines.forEach((line) => {
    const box = line.querySelector('.recs');
    if (!box) return;
    const mine = all
      .filter((r) => r.week === +line.dataset.lw && r.zh === line.dataset.zh)
      .sort((a, b) => b.created - a.created)
      .slice(0, 3);
    box.innerHTML = mine.map(recItemHTML).join('');
  });
}

/* ============ 학습 단계 구성 ============ */
function buildSteps(w, type, practiceOnly, free) {
  const steps = [];
  if (!free) {
    const due = dueCards();
    if (due.length) steps.push({ kind: 'srs', title: '복습 카드', min: 5, cards: due });
  }
  if (practiceOnly) return steps;

  const v = w.vocab;
  const half = Math.ceil(v.length / 2);
  const a = v.slice(0, half), b = v.slice(half);

  switch (type.id) {
    case 'words1':
      steps.push({ kind: 'words', title: '오늘의 단어', min: 8, items: a },
                 { kind: 'trace', title: '한자 쓰기', min: 6, items: a },
                 { kind: 'typepy', title: '병음 쓰기', min: 6, items: a },
                 { kind: 'quiz', title: '미니 퀴즈', min: 5, items: a, pool: v });
      break;
    case 'words2':
      steps.push({ kind: 'words', title: '오늘의 단어', min: 8, items: b },
                 { kind: 'trace', title: '한자 쓰기', min: 6, items: b },
                 { kind: 'typepy', title: '병음 쓰기', min: 6, items: b },
                 { kind: 'quiz', title: '미니 퀴즈', min: 5, items: b, pool: v });
      break;
    case 'sentences':
      steps.push({ kind: 'sentences', title: '핵심 문장', min: 15, items: w.sentences },
                 { kind: 'speak', title: '따라 말하기', min: 10, lines: w.sentences.slice(0, 4) });
      break;
    case 'grammar':
      steps.push({ kind: 'grammar', title: '문법 포인트', min: 10, items: w.grammar },
                 { kind: 'dialogue', title: '대화문 듣기', min: 8, lines: w.dialogue },
                 { kind: 'speak', title: '대화 롤플레이', min: 12, lines: w.dialogue, roleplay: true });
      break;
    case 'review': {
      const cit = w.corner ? w.corner.groups.flatMap((g) => g.items) : [];
      if (!cit.length) {
        steps.push({ kind: 'quiz', title: '복습 퀴즈', min: 25, items: shuffle(v).slice(0, 10), pool: v });
      } else {
        steps.push({ kind: 'quiz', title: '복습 퀴즈', min: 8, items: shuffle(v).slice(0, 8), pool: v },
                   { kind: 'cread', title: '코너: 듣고 읽기', min: 8, corner: w.corner },
                   { kind: 'csay', title: '코너: 말하기', min: 8, corner: w.corner },
                   { kind: 'cquiz', title: '코너: 퀴즈', min: 6, items: shuffle(cit).slice(0, 8), pool: cit });
      }
      break;
    }
    case 'check':
      // 6일차: 이 주차 문장을 단어 카드로 직접 만들어 보는 문장 만들기 (문제는 단계가 열릴 때 생성)
      steps.push({ kind: 'build', title: '문장 만들기', min: 25, data: w });
      break;
  }
  return steps;
}

const frame = (body) => `<section class="panel">
  <div class="sess-top"><button data-exit>← ${session.free ? `${session.week}주차 화면으로 돌아가기` : '홈으로 돌아가기'}</button></div>
  <div class="steps">${session.steps.map((s, k) =>
    `<button type="button" class="dot ${s.done ? 'done' : ''} ${k === session.i ? 'now' : ''}" data-step="${k}">${esc(s.title)}</button>`).join('')}</div>
  ${body}
</section>`;

/* ============ 화면: 홈 ============ */
async function renderHome() {
  const tk = ++viewToken;
  const c = S.cursor;
  const pct = Math.min(100, (c / TOTAL_SESSIONS) * 100);
  const curWeek = Math.min(weekOf(c), TOTAL_WEEKS);
  const curLv = levelOfCursor(c);
  const segs = curriculum.stages.map((s, i) => {
    const L = LV(i), a0 = (s.from - 1) * DAYS_PER_WEEK, a1 = s.to * DAYS_PER_WEEK;
    const f = Math.max(0, Math.min(100, ((c - a0) / (a1 - a0)) * 100));
    return `<div class="lvseg" style="flex:${s.to - s.from + 1};background:${L.tint}" title="${L.name}"><div style="width:${f}%;background:${L.color}"></div></div>`;
  }).join('');
  const legend = curriculum.stages.map((s, i) => {
    const L = LV(i);
    return `<div class="lvcell${i === curLv ? ' now' : ''}" style="background:${L.tint};border-color:${L.color}"><span class="lvi">${L.icon}</span><b style="color:${L.color}">${L.name}</b><small>${s.from}~${s.to}주</small></div>`;
  }).join('');
  const progress = `<section class="panel">
    <div class="prog-head"><b>전체 진척률</b><span class="prog-pct">${pct.toFixed(1)}%</span></div>
    <div class="lvbar">${segs}</div>
    <div class="lvlegend">${legend}</div>
    <div class="muted small">${Math.min(c, TOTAL_SESSIONS)} / ${TOTAL_SESSIONS} 학습일 완료 · ${curWeek} / ${TOTAL_WEEKS}주차 진행 중</div>
  </section>`;

  if (c >= TOTAL_SESSIONS) {
    app.innerHTML = progress + `<section class="panel center"><h2>🎓 2년 과정을 모두 마쳤습니다!</h2><p class="muted">수고하셨습니다. 기록 탭에서 전체 성장을 확인해 보세요.</p></section>`;
    return;
  }

  const w = weekOf(c), type = DAY_TYPES[dayOf(c)];
  const stage = stageOf(w);
  const around = [w - 1, w, w + 1];
  const datas = await Promise.all(around.map((n) => (n >= 1 && n <= TOTAL_WEEKS ? getJSON(weekPath(n)) : Promise.resolve(null))));
  if (tk !== viewToken) return;
  const data = datas[1];
  const todayCount = Number(S.completed[todayStr()]) || 0;
  const plan = data ? buildSteps(data, type, false, false) : [];
  const prog = S.progress && S.progress.cursor === c ? S.progress.done : [];
  plan.forEach((x) => { if (prog.includes(x.kind)) x.done = true; });
  const dueCount = Object.values(S.srs).filter((x) => x.due <= todayStr()).length;

  const labels = ['이전', '현재', '다음'];
  const lessons = around.map((n, k) => {
    if (n < 1 || n > TOTAL_WEEKS) {
      return `<div class="lesson off"><span class="lab">${labels[k]}</span><b class="wk">—</b><span class="muted">없음</span></div>`;
    }
    const d = datas[k];
    return `<button class="lesson ${k === 1 ? 'now' : ''}" data-week="${n}">
      <span class="lab">${labels[k]} (${n}주차)</span><span class="wt">${d ? esc(d.theme) : '준비 중'}</span></button>`;
  }).join('');

  let action;
  if (!data) {
    action = `<p class="muted">이 주차 콘텐츠(<code>${weekPath(w)}</code>)가 아직 없습니다. 파일을 추가하면 바로 열립니다.</p>`;
  } else {
    action = `${todayCount ? `<p>✅ 오늘 ${todayCount}일차를 마쳤습니다. 더 공부하고 싶다면 다음 일차를 이어서 학습할 수 있어요.</p>` : ''}
      <div class="row"><button id="start" class="primary">${prog.length ? '이어서 학습하기 →' : todayCount ? '다음 일차 학습하기 →' : '오늘 학습 시작 →'}</button>
      ${todayCount ? `<button id="practice" ${dueCount ? '' : 'disabled'}>복습 카드 더 하기${dueCount ? ` (${dueCount})` : ''}</button>` : ''}</div>`;
  }

  app.innerHTML = progress + `
    <section class="panel">
      <div class="lessons">${lessons}</div>
    </section>
    <section class="panel">
      <div class="stage">${esc(stage.title)} · ${esc(stage.hsk)}</div>
      <h2>${data ? esc(data.theme) : `${w}주차`} — ${esc(type.label)}</h2>
      ${data ? `<p class="hint">이번 주 목표: ${esc(data.goal)}</p>` : ''}
      ${plan.length ? `<ol class="plan">${plan.map((s) => `<li>${s.done ? '✓ ' : ''}${esc(s.title)} · ${s.min}분</li>`).join('')}</ol>` : ''}
      ${action}
    </section>
    <section class="panel">
      <div class="stats-row">
        <div class="stat"><b>${streak()}</b>연속 학습일</div>
        <div class="stat"><b>${S.cursor}</b>완료 일차</div>
        <div class="stat"><b>${todayCount}</b>오늘 완료</div>
        <div class="stat"><b>${Object.keys(S.srs).length}</b>배운 단어</div>
      </div>
    </section>`;
  const st = document.getElementById('start');
  if (st) st.onclick = () => startSession(false);
  const pr = document.getElementById('practice');
  if (pr) pr.onclick = () => startSession(true);
}

/* ============ 화면: 차시(주차) ============ */
async function renderWeek(n) {
  const tk = ++viewToken;
  hideTip();
  stopRec();
  session = null;
  const data = await getJSON(weekPath(n));
  if (tk !== viewToken) return;
  if (!data) {
    app.innerHTML = `<section class="panel"><button id="back">← 홈</button>
      <h2>${n}주차</h2><p class="muted">이 주차 콘텐츠가 아직 없습니다.</p></section>`;
    document.getElementById('back').onclick = () => go('home');
    return;
  }
  const stage = stageOf(n);
  const doneToday = !!S.completed[todayStr()];
  const days = DAY_TYPES.map((t, d) => {
    const idx = (n - 1) * DAYS_PER_WEEK + d;
    const state = idx < S.cursor ? 'done' : idx === S.cursor ? 'now' : 'todo';
    const label = state === 'done' ? '다시 학습' : state === 'now' ? (S.progress && S.progress.cursor === S.cursor ? '이어서 학습' : doneToday ? '다음 일차 학습' : '오늘 학습 시작') : '미리 보기';
    const disabled = '';
    return `<li class="day ${state}">
      <span class="dn">${d + 1}일차</span><span class="dl">${esc(t.label)}</span>
      <button data-day="${d}" ${disabled} class="${state === 'now' ? 'primary' : ''}">${label}</button></li>`;
  }).join('');

  app.innerHTML = `
    <section class="panel" data-weekpage="${n}">
      <button id="back">← 홈</button>
      <div class="stage">${esc(stage.title)} · ${esc(stage.hsk)}</div>
      <h2>${n}주차 · ${esc(data.theme)}</h2>
      <p class="hint">목표: ${esc(data.goal)}</p>
      <ul class="days">${days}</ul>
      <p class="hint">현재 진도가 아닌 날을 학습하면 복습·미리 보기로 진행되며 진척률에는 반영되지 않습니다.</p>
    </section>
    <section class="panel">
      <h2>예제 문장 읽고 녹음하기</h2>
      <p class="hint">🔊로 먼저 듣고, ⏺ 녹음을 눌러 문장을 읽은 뒤 ⏹ 정지를 누르세요. 녹음은 바로 아래에서 다시 들을 수 있고, 전체 목록은 '녹음' 탭에 모입니다.</p>
      ${data.sentences.map((l) => lineHTML(l, { week: n, rec: true })).join('')}
    </section>`;
  document.getElementById('back').onclick = () => go('home');
  hydrateRecs();
}

/* ============ 화면: 학습 세션 ============ */
async function startSession(practice, target) {
  const tk = ++viewToken;
  const c = target ? (target.week - 1) * DAYS_PER_WEEK + target.day : S.cursor;
  const w = weekOf(c);
  const data = await getJSON(weekPath(w));
  if (!data || tk !== viewToken) return;
  const type = DAY_TYPES[dayOf(c)];
  const free = !practice && c !== S.cursor; // 현재 진도가 아닌 날: 진도에 반영하지 않음
  const steps = buildSteps(data, type, practice, free);
  if (!steps.length) return renderHome();
  // 문장 만들기(7일차)는 '이 주차까지 배운 단어'가 필요하다
  const lex = !practice && type.id === 'check' ? await cumulativeLex(w) : null;
  if (tk !== viewToken) return;
  session = { steps, i: 0, type, practice, free, week: w, checkScore: null, lex };
  // 오늘 진도 학습: 이전에 완료한 단계 복원
  if (!practice && !free && S.progress && S.progress.cursor === S.cursor) {
    steps.forEach((x) => { if (S.progress.done.includes(x.kind)) x.done = true; });
  }
  const first = steps.findIndex((x) => !x.done);
  if (first < 0) return finish();
  session.i = first;
  renderStep();
}

// 단계 완료 표시 (오늘 진도 학습이면 저장)
function markDone(st) {
  st.done = true;
  if (session && !session.free && !session.practice) {
    S.progress = { cursor: S.cursor, done: session.steps.filter((x) => x.done).map((x) => x.kind) };
    save();
  }
}
// 다음 미완료 단계로, 전부 끝났으면 그날 학습 완료
function advance() {
  const n = session.steps.length;
  if (session.steps.every((x) => x.done)) return finish();
  for (let k = 1; k <= n; k++) {
    const j = (session.i + k) % n;
    if (!session.steps[j].done) { session.i = j; break; }
  }
  renderStep();
}

function renderStep() {
  viewToken++;
  stopRec();
  if (session.i >= session.steps.length) return finish();
  const st = session.steps[session.i];
  const next = () => { markDone(st); advance(); };
  const handlers = {
    srs: stepSRS, words: stepWords, sentences: stepSentences,
    grammar: stepGrammar, speak: stepLines, dialogue: stepLines, quiz: stepQuiz, build: stepBuild,
    trace: stepTrace, typepy: stepTypePinyin,
    cread: stepCornerRead, csay: stepCornerSay, cquiz: stepQuiz,
  };
  handlers[st.kind](st, next);
  window.scrollTo(0, 0);
}

function stepSRS(st, next) {
  let i = 0;
  const show = () => {
    if (i >= st.cards.length) return next();
    const c = st.cards[i];
    app.innerHTML = frame(`
      <p class="hint">${i + 1} / ${st.cards.length} · 뜻이 기억나는지 먼저 떠올려 보세요.</p>
      <div class="card big">
        <div class="hanzi">${esc(c.zh)}</div>
        <div id="ans" hidden><div class="py">${esc(c.py)}</div><div>${esc(c.ko)}</div></div>
      </div>
      <div class="row"><button class="icon" data-say="${esc(c.zh)}">🔊</button><button id="reveal">정답 보기</button></div>
      <div class="row" id="rate" hidden>
        <button id="no" class="bad">헷갈려요</button>
        <button id="yes" class="good">알아요</button>
      </div>`);
    const reveal = document.getElementById('reveal');
    reveal.onclick = () => {
      document.getElementById('ans').hidden = false;
      document.getElementById('rate').hidden = false;
      reveal.hidden = true;
    };
    document.getElementById('yes').onclick = () => { grade(c, true); i++; show(); };
    document.getElementById('no').onclick = () => { grade(c, false); i++; show(); };
  };
  show();
}

function stepWords(st, next) {
  // 미리 보기(아직 진도가 안 된 주차)에서는 복습 카드에 단어를 등록하지 않는다
  if (!session.free || session.week <= weekOf(S.cursor)) {
    st.items.forEach((it) => {
      if (!S.srs[it.zh]) S.srs[it.zh] = { py: it.py, ko: it.ko, box: 0, due: addDays(todayStr(), 1) };
    });
    save();
  }
  app.innerHTML = frame(`
    <p class="hint">🔊를 눌러 듣고, 소리 내어 따라 읽으며 하나씩 눈에 익히세요.</p>
    <div class="grid">${st.items.map((it) => `
      <div class="card">
        <div class="hanzi">${esc(it.zh)}</div>
        <div class="py">${esc(it.py)}</div>
        <div>${esc(it.ko)}</div>
        <button class="icon" data-say="${esc(it.zh)}" aria-label="듣기">🔊</button>
      </div>`).join('')}</div>
    <div class="row"><button id="next" class="primary">다 봤어요 →</button></div>`);
  document.getElementById('next').onclick = next;
}

const RV_LABEL = { zh: '한자', py: '한어병음', ko: '한글' };
// 눌러서 보는 줄: base는 처음부터 보이고, hide에 든 항목은 버튼을 눌러야 보인다
function revealItemHTML(l, base, hide) {
  const cls = { zh: 'hanzi sm', py: 'py', ko: 'ko' };
  return `<div class="rv-base ${base === 'ko' ? 'ko big sm' : 'hanzi sm'}">${esc(l[base])}</div>` +
    hide.map((k) => `<button type="button" class="rv-btn" data-rv="${k}" aria-expanded="false">${RV_LABEL[k]}</button>
      <div class="rv-body ${cls[k]}" data-rvb="${k}" hidden>${esc(l[k])}</div>`).join('');
}
function revealLineHTML(l, o = {}) {
  const lw = o.week != null ? ` data-lw="${o.week}"` : '';
  return `<div class="line rv-line${l.sp ? '' : ' nosp'}" data-zh="${esc(l.zh)}"${lw}>
    ${l.sp ? `<b class="sp">${esc(l.sp)}</b>` : ''}
    <div>${revealItemHTML(l, o.base, o.hide)}</div>
    <div class="ctl">
      <button class="icon" data-say="${esc(l.zh)}" title="듣기">🔊</button>
      ${o.rec ? '<button class="icon rec" data-rec title="내 목소리 녹음">⏺ 녹음</button>' : ''}
    </div>
    <div class="mic-result"></div>
    ${o.rec ? '<div class="recs"></div>' : ''}
  </div>`;
}

// 한 화면에 항목 하나씩, 큰 글씨로 보여 주는 공통 도우미 (3·4일차)
function pagedStep(pages, next, o) {
  let k = 0;
  const render = () => {
    stopRec();
    const last = k === pages.length - 1;
    app.innerHTML = frame(`${o.hint ? `<p class="hint">${o.hint}</p>` : ''}
      <div class="pg-count">${k + 1} / ${pages.length}</div>
      <div class="paged${o.cls ? ' ' + o.cls : ''}">${pages[k]}</div>
      <div class="row pg-nav"><button id="pg-prev" ${k ? '' : 'disabled'}>← 이전</button>
      <button id="next" class="primary">${last ? o.done : '다음 →'}</button></div>`);
    document.getElementById('pg-prev').onclick = () => { k--; render(); };
    document.getElementById('next').onclick = () => { if (k < pages.length - 1) { k++; render(); } else next(); };
    if (o.after) o.after();
    window.scrollTo(0, 0);
  };
  render();
}

function stepSentences(st, next) {
  pagedStep(st.items.map((l) => revealLineHTML(l, { week: session.week, rec: true, base: 'ko', hide: ['zh', 'py'] })), next, {
    hint: "한글 뜻을 보고 중국어로 말해 본 뒤, '한자'·'한어병음' 버튼을 눌러 확인하세요. 🔊로 듣고 ⏺ 녹음으로 내 목소리를 남길 수 있습니다.",
    done: '다 봤어요 →', after: hydrateRecs,
  });
}

// 주제 확장 코너 ① 듣고 읽기: 그룹별 목록을 🔊로 듣고 따라 읽는다
function stepCornerRead(st, next) {
  const c = st.corner;
  app.innerHTML = frame(`
    <h2>${esc(c.title)}</h2>
    <p class="hint">${esc(c.intro)}<br>🔊를 눌러 듣고 소리 내어 따라 읽으세요.</p>
    ${c.groups.map((g) => `<h3 class="cgroup">${esc(g.name)}</h3>${g.items.map((l) => lineHTML(l)).join('')}`).join('')}
    <div class="row"><button id="next" class="primary">다 읽었어요 →</button></div>`);
  document.getElementById('next').onclick = next;
}
// 주제 확장 코너 ② 말하기: 한글 뜻을 보고 말해 본 뒤 눌러서 확인
function stepCornerSay(st, next) {
  const c = st.corner;
  app.innerHTML = frame(`
    <h2>${esc(c.title)}</h2>
    <p class="hint">한국어 뜻을 보고 중국어로 먼저 말해 보세요. 그다음 '한자'·'한어병음' 버튼을 눌러 확인하고 🔊로 들어 보세요.</p>
    ${c.groups.map((g) => `<h3 class="cgroup">${esc(g.name)}</h3>${g.items.map((l) => revealLineHTML(l, { base: 'ko', hide: ['zh', 'py'] })).join('')}`).join('')}
    <div class="row"><button id="next" class="primary">다 해 봤어요 →</button></div>`);
  document.getElementById('next').onclick = next;
}

function stepGrammar(st, next) {
  pagedStep(st.items.map((g) => `
    <div class="grammar">
      <h3>${esc(g.title)}</h3>
      <p class="hint">${esc(g.rule)}</p>
      ${g.examples.map((e) => `<div class="example">
        <span class="hanzi sm">${esc(e.zh)}</span> <button class="icon" data-say="${esc(e.zh)}">🔊</button>
        <div class="rv-row"><button type="button" class="rv-btn" data-rv="py" aria-expanded="false">한어병음</button>
        <button type="button" class="rv-btn" data-rv="ko" aria-expanded="false">한글</button></div>
        <div class="rv-body py" data-rvb="py" hidden>${esc(e.py)}</div><div class="rv-body ko" data-rvb="ko" hidden>${esc(e.ko)}</div></div>`).join('')}
    </div>`), next, { done: '다 봤어요 →' });
}

function lineHTML(l, o = {}) {
  const lw = o.week != null ? ` data-lw="${o.week}"` : '';
  return `<div class="line${l.sp ? '' : ' nosp'}" data-zh="${esc(l.zh)}"${lw}>
    ${l.sp ? `<b class="sp">${esc(l.sp)}</b>` : ''}
    <div><div class="hanzi sm">${esc(l.zh)}</div><div class="py">${esc(l.py)}</div><div class="ko">${esc(l.ko)}</div></div>
    <div class="ctl">
      <button class="icon" data-say="${esc(l.zh)}" title="듣기">🔊</button>
      ${o.mic ? '<button class="icon" data-mic title="음성 인식으로 확인">🎤</button>' : ''}
      ${o.rec ? '<button class="icon rec" data-rec title="내 목소리 녹음">⏺ 녹음</button>' : ''}
    </div>
    <div class="mic-result"></div>
    ${o.rec ? '<div class="recs"></div>' : ''}
  </div>`;
}

function stepLines(st, next) {
  const mic = st.kind === 'speak';
  const hint = st.roleplay
    ? 'A 대사는 🔊로 듣고, B 대사는 🎤로 말해 확인해 보세요. ⏺ 녹음으로 내 목소리를 남길 수도 있습니다. 다음에는 역할을 바꿔 보세요.'
    : mic ? '🔊로 듣고 🎤로 따라 말해 보세요. ⏺ 녹음으로 내 목소리를 남길 수 있습니다. (음성 인식은 Chrome 권장)' : '🔊로 들으며 대화 흐름을 익히세요. 모르는 줄은 \'한어병음\'·\'한글\' 버튼으로 확인하세요.';
  const html = (l) => mic ? lineHTML(l, { week: session.week, mic, rec: mic })
    : revealLineHTML(l, { week: session.week, base: 'zh', hide: ['py', 'ko'] });
  // 대화문(듣기·롤플레이)은 두 줄씩 한 화면에, 문장 따라 말하기는 한 줄씩
  const pair = st.kind === 'dialogue' || st.roleplay;
  const pages = [];
  for (let i = 0; i < st.lines.length; i += pair ? 2 : 1) pages.push(st.lines.slice(i, i + (pair ? 2 : 1)).map(html).join(''));
  pagedStep(pages, next, { hint, done: '마쳤어요 →', after: mic ? hydrateRecs : null, cls: pair ? 'two' : '' });
}

function stepQuiz(st, next) {
  const qs = st.items.map((it, k) => {
    const mode = k % 2 === 0 ? 'zh2ko' : 'ko2zh';
    const others = shuffle(st.pool.filter((p) => p.zh !== it.zh && p.ko !== it.ko)).slice(0, 3);
    return { it, mode, opts: shuffle([it, ...others]) };
  });
  let i = 0, score = 0;

  const show = () => {
    if (i >= qs.length) return result();
    const q = qs[i];
    const prompt = q.mode === 'zh2ko'
      ? `<div class="hanzi">${esc(q.it.zh)}</div><button class="icon" data-say="${esc(q.it.zh)}">🔊</button>`
      : `<div class="ko big">${esc(q.it.ko)}</div>`;
    app.innerHTML = frame(`
      <p class="hint">${i + 1} / ${qs.length}</p>
      <div class="card big">${prompt}</div>
      <div class="opts">${q.opts.map((o, k) =>
        `<button class="opt" data-k="${k}">${esc(q.mode === 'zh2ko' ? o.ko : o.zh)}</button>`).join('')}</div>
      `);
    const tk = viewToken;
    let firstTry = true;
    document.querySelectorAll('.opt').forEach((b) => {
      b.onclick = () => {
        const ok = q.opts[+b.dataset.k].zh === q.it.zh;
        if (firstTry) { firstTry = false; if (ok) score++; grade(q.it, ok); }
        if (!ok) {                       // 틀리면 그 보기만 막고 다시 고르게 한다
          b.disabled = true; b.classList.add('wrong');
          toast('다시 선택해 주세요!', 'bad');
          return;
        }
        document.querySelectorAll('.opt').forEach((x) => { x.disabled = true; });
        b.classList.add('right');
        toast('정답입니다!', 'good');
        setTimeout(() => { if (tk === viewToken) { i++; show(); } }, window.QUIZ_DELAY ?? 800);
      };
    });
  };

  const result = () => {
    const pct = Math.round((score / qs.length) * 100);
    if (st.isCheck) session.checkScore = pct;
    markDone(st);
    const msg = pct >= 80 ? '훌륭해요! 👏' : '틀린 단어는 다음 학습 때 복습 카드로 다시 나옵니다.';
    app.innerHTML = frame(`<div class="center"><h2>${score} / ${qs.length} (${pct}점)</h2>
      <p class="muted">${msg}</p><button id="nx" class="primary">계속 →</button></div>`);
    document.getElementById('nx').onclick = next;
  };
  show();
}

/* ============ 단어 쓰기 (1·2일차): 한자 따라 쓰기 + 병음 쓰기 ============ */
const TONE_MARKS = { a: 'aāáǎà', e: 'eēéěè', i: 'iīíǐì', o: 'oōóǒò', u: 'uūúǔù', 'ü': 'üǖǘǚǜ' };
const TONE_GROUPS = ['āáǎà', 'ēéěè', 'īíǐì', 'ōóǒò', 'ūúǔù', 'ǖǘǚǜ'];
const WRITE_FONT = '"KaiTi","楷体","STKaiti","Noto Serif SC","Noto Sans SC","Microsoft YaHei","PingFang SC",serif';

// 성조 숫자(1~4)를 알맞은 모음 위의 성조 표기로 바꾼다. 5(경성)는 표기 없음.
// 규칙: a, e가 있으면 거기에, ou는 o에, 그 밖에는 마지막 모음에. (마지막 음절의 모음 덩어리 기준)
function applyTone(chunk, tone) {
  const t = +tone;
  if (!(t >= 1 && t <= 4)) return chunk;
  const m = /[aeiouü]+(?=[^aeiouü]*$)/.exec(chunk);
  if (!m) return chunk;
  const run = m[0];
  let pos = run.indexOf('a');
  if (pos < 0) pos = run.indexOf('e');
  if (pos < 0) pos = run.indexOf('ou') >= 0 ? run.indexOf('ou') : run.length - 1;
  const at = m.index + pos;
  return chunk.slice(0, at) + TONE_MARKS[chunk[at]][t] + chunk.slice(at + 1);
}

// 병음 비교용으로 정리: 소문자, 공백·아포스트로피 제거, v→ü, 성조 숫자(ni3) → 성조 표기(nǐ)
function normPy(s) {
  const t = s.normalize('NFC').toLowerCase().replace(/[\s'’\-·]/g, '').replace(/v/g, 'ü');
  return t.replace(/([a-zü]+)([1-5])/g, (_, c, d) => applyTone(c, d)).normalize('NFC');
}
const stripTone = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

// 'ok' = 정답, 'tone' = 글자는 맞고 성조만 다름, 'no' = 오답
function judgePinyin(val, it, mode) {
  const typed = val.normalize('NFC');
  if (mode === 'ko' && /[一-鿿]/.test(typed)) {
    return typed.replace(/[\s，。！？、,.!?]/g, '') === it.zh ? 'ok' : 'no'; // 한자 입력기로 쓴 경우
  }
  const a = normPy(typed), b = normPy(it.py);
  if (a === b) return 'ok';
  return stripTone(a) === stripTone(b) ? 'tone' : 'no';
}

// 한자 쓰기 칸: 아래층 canvas = 격자 + 연한 가이드 글자, 위층 canvas = 내가 쓰는 획
function setupPad(zh, onStroke, penW) {
  const chars = [...zh];
  const box = document.getElementById('pad');
  const avail = Math.min(box.parentElement.clientWidth || 360, 520);
  const cell = Math.max(72, Math.min(180, Math.floor(avail / chars.length)));
  const W = cell * chars.length, H = cell;
  const dpr = window.devicePixelRatio || 1;
  box.style.width = W + 'px';
  box.style.height = H + 'px';
  const guide = document.getElementById('pad-guide');
  const draw = document.getElementById('pad-draw');
  for (const c of [guide, draw]) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    c.style.width = W + 'px';
    c.style.height = H + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const cs = getComputedStyle(document.documentElement);
  const col = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
  const g = guide.getContext('2d');
  const d = draw.getContext('2d');
  let showGuide = true;
  let strokes = 0;

  const paintGuide = () => {
    g.clearRect(0, 0, W, H);
    chars.forEach((ch, k) => {
      const x = k * cell;
      g.strokeStyle = col('--line', '#ddd');
      g.lineWidth = 1;
      g.setLineDash([]);
      g.strokeRect(x + 0.5, 0.5, cell - 1, cell - 1);
      g.setLineDash([4, 4]);
      g.beginPath();
      g.moveTo(x, cell / 2); g.lineTo(x + cell, cell / 2);
      g.moveTo(x + cell / 2, 0); g.lineTo(x + cell / 2, cell);
      g.stroke();
      g.setLineDash([]);
      if (showGuide) {
        g.globalAlpha = 0.13;
        g.fillStyle = col('--text', '#222');
        g.font = `${Math.round(cell * 0.78)}px ${WRITE_FONT}`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(ch, x + cell / 2, cell / 2 + cell * 0.04);
        g.globalAlpha = 1;
      }
    });
  };
  paintGuide();

  d.lineCap = 'round';
  d.lineJoin = 'round';
  d.lineWidth = penW;
  d.strokeStyle = PEN_GREEN;
  d.fillStyle = d.strokeStyle;

  let drawing = false, last = null;
  const pt = (e) => { const r = draw.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  draw.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { draw.setPointerCapture(e.pointerId); } catch (err) { /* 포인터 캡처 불가해도 그리기는 가능 */ }
    drawing = true;
    last = pt(e);
    d.beginPath();
    d.arc(last.x, last.y, d.lineWidth / 2, 0, Math.PI * 2); // 점 하나도 찍히게
    d.fill();
  });
  draw.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pt(e);
    d.beginPath();
    d.moveTo(last.x, last.y);
    d.lineTo(p.x, p.y);
    d.stroke();
    last = p;
  });
  const end = () => { if (!drawing) return; drawing = false; strokes++; onStroke(strokes); };
  draw.addEventListener('pointerup', end);
  draw.addEventListener('pointercancel', end);

  return {
    clear() { d.clearRect(0, 0, W, H); strokes = 0; onStroke(0); },
    toggleGuide() { showGuide = !showGuide; paintGuide(); return showGuide; },
    setWidth(w) { d.lineWidth = w; },
  };
}

// 펜 굵기: 자유 쓰기(px) / 획순 쓰기(Hanzi Writer drawingWidth)
const PEN_LABEL = { thin: '가늘게', normal: '보통', thick: '굵게' };
const PEN_FREE = { thin: 1.5, normal: 2.5, thick: 4.5 };
const PEN_HW = { thin: 2, normal: 4, thick: 7 };
// 획순 데이터는 Hanzi Writer 라이브러리(인터넷 필요)를 쓴다. 막혀 있으면 자유 쓰기로 대체.
const HW_URLS = [
  'https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js',
  'https://unpkg.com/hanzi-writer@3.5.0/dist/hanzi-writer.min.js',
];
let hwPromise = null;
function loadHanziWriter() {
  if (window.HanziWriter) return Promise.resolve(window.HanziWriter);
  if (hwPromise) return hwPromise;
  hwPromise = new Promise((resolve, reject) => {
    let k = 0, settled = false;
    const fail = () => { if (settled) return; settled = true; hwPromise = null; reject(new Error('hanzi-writer')); };
    const tryNext = () => {
      if (k >= HW_URLS.length) return fail();
      const sc = document.createElement('script');
      sc.src = HW_URLS[k++];
      let over = false;
      const timer = setTimeout(() => { over = true; tryNext(); }, 6000);
      sc.onload = () => {
        clearTimeout(timer);
        if (settled) return;
        if (window.HanziWriter) { settled = true; resolve(window.HanziWriter); } else if (!over) tryNext();
      };
      sc.onerror = () => { clearTimeout(timer); if (!over) tryNext(); };
      document.head.appendChild(sc);
    };
    tryNext();
  });
  return hwPromise;
}

function stepTrace(st, next) {
  let i = 0;
  const pen = () => { if (!S.pen) S.pen = { w: 'normal', mode: 'order' }; return S.pen; };
  const show = () => {
    if (i >= st.items.length) return next();
    const it = st.items[i];
    const myTok = viewToken;
    app.innerHTML = frame(`
      <p class="hint" id="p-hint"></p>
      <div class="card">
        <div class="py">${esc(it.py)}</div>
        <div>${esc(it.ko)} <button class="icon" data-say="${esc(it.zh)}" aria-label="듣기">🔊</button></div>
      </div>
      <div class="seg" role="group" aria-label="쓰기 방식">
        <button type="button" data-mode="order">획순 따라 쓰기</button>
        <button type="button" data-mode="free">자유 쓰기</button>
      </div>
      <div id="trace-area"></div>
      <div class="pen-row"><span class="muted small">펜 굵기</span>
        ${Object.keys(PEN_LABEL).map((k) => `<button type="button" class="pen-btn" data-pen="${k}">${PEN_LABEL[k]}</button>`).join('')}</div>
      <div class="row">
        <button id="p-done" class="primary" disabled>다 썼어요 →</button>
        <button id="p-skip" class="icon">건너뛰기</button>
      </div>`);
    const done = document.getElementById('p-done');
    const area = document.getElementById('trace-area');
    const hint = document.getElementById('p-hint');
    const alive = () => viewToken === myTok && document.body.contains(area);
    done.onclick = () => { i++; show(); };
    document.getElementById('p-skip').onclick = () => { i++; show(); };

    const mark = () => {
      document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === pen().mode));
      document.querySelectorAll('[data-pen]').forEach((b) => b.classList.toggle('on', b.dataset.pen === pen().w));
    };

    // ---- 자유 쓰기: 연한 가이드 글자를 따라 쓰는 canvas ----
    const mountFree = () => {
      done.disabled = true;
      hint.textContent = `${i + 1} / ${st.items.length} · 연한 글자를 따라 써 보세요. 손가락·마우스·펜으로 쓸 수 있고, 익숙해지면 가이드를 숨기고 외워서 써 보세요.`;
      area.innerHTML = `<div class="pad-wrap"><div class="pad" id="pad"><canvas id="pad-guide"></canvas><canvas id="pad-draw"></canvas></div></div>
        <div class="row"><button id="p-clear">지우기</button><button id="p-guide">가이드 숨기기</button></div>`;
      const padObj = setupPad(it.zh, (n) => { done.disabled = n === 0; }, PEN_FREE[pen().w]);
      document.getElementById('p-clear').onclick = () => padObj.clear();
      document.getElementById('p-guide').onclick = (e) => {
        e.currentTarget.textContent = padObj.toggleGuide() ? '가이드 숨기기' : '가이드 보이기';
      };
      trace.setWidth = (w) => padObj.setWidth(PEN_FREE[w]);
    };

    // ---- 획순 쓰기: Hanzi Writer가 획순대로 쓰는지 채점 ----
    const mountOrder = () => {
      done.disabled = true;
      hint.textContent = `${i + 1} / ${st.items.length} · 획순 연습을 준비하는 중…`;
      area.innerHTML = '<p class="muted center">불러오는 중…</p>';
      loadHanziWriter().then((HW) => {
        if (!alive() || pen().mode !== 'order') return;
        const chars = [...it.zh].filter((ch) => /[㐀-鿿]/.test(ch));
        if (!chars.length) throw new Error('nochar');
        const avail = Math.min(area.clientWidth || 360, 520);
        const cell = Math.max(88, Math.min(200, Math.floor(avail / chars.length)));
        const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        const cs = getComputedStyle(document.documentElement);
        const textCol = cs.getPropertyValue('--text').trim() || '#222';
        const accent = cs.getPropertyValue('--accent').trim() || '#c8102e';
        area.innerHTML = `<div class="hw-box">${chars.map((_, k) => `<div class="hw-cell" id="hw-${k}" style="width:${cell}px;height:${cell}px"></div>`).join('')}</div>
          <p class="build-msg" id="hw-msg"></p>
          <div class="row"><button id="hw-anim">▶ 획순 보기</button><button id="hw-redo">✍ 처음부터 쓰기</button><button id="hw-hint">윤곽 숨기기</button></div>`;
        const msg = document.getElementById('hw-msg');
        let outline = true, mistakes = 0, token = 0, finished = false;
        const setMsg = (t, cls) => { msg.textContent = t; msg.className = 'build-msg ' + (cls || ''); };
        const writers = chars.map((ch, k) => HW.create(document.getElementById('hw-' + k), ch, {
          width: cell, height: cell, padding: Math.round(cell * 0.06),
          showOutline: true, showCharacter: false,
          strokeColor: PEN_GREEN, outlineColor: dark ? '#5a524c' : '#ece7df',
          drawingColor: PEN_GREEN, highlightColor: accent, drawingWidth: PEN_HW[pen().w],
          strokeAnimationSpeed: 1.2, delayBetweenStrokes: 250, showHintAfterMisses: 2, leniency: 1.1,
          onLoadCharDataError: () => { if (alive()) fallback('획순 데이터를 불러오지 못했어요.'); },
        }));
        const cells = chars.map((_, k) => document.getElementById('hw-' + k));
        const stop = () => { token++; writers.forEach((w) => { try { w.cancelQuiz(); } catch (e) { /* 퀴즈 중이 아니면 무시 */ } }); };
        const quizFrom = (k, tk) => {
          if (tk !== token || !alive()) return;
          if (k >= writers.length) {
            finished = true; done.disabled = false;
            setMsg(mistakes ? `✅ 다 썼어요! (틀린 획 ${mistakes}번) 한 번 더 써 보면 더 좋아요.` : '✅ 완벽해요! 획순을 모두 맞게 썼어요.', 'good');
            cells.forEach((c) => c.classList.remove('active'));
            return;
          }
          cells.forEach((c, n) => c.classList.toggle('active', n === k));
          setMsg(chars.length > 1 ? `${k + 1}번째 글자(${chars[k]})를 획순대로 써 보세요.` : '획순대로 한 획씩 써 보세요.');
          writers[k].quiz({
            onCorrectStroke: (d) => { if (tk === token) setMsg(d.strokesRemaining ? `✓ 좋아요! 남은 획 ${d.strokesRemaining}` : '✓ 글자 완성!', 'good'); },
            onMistake: () => { if (tk === token) { mistakes++; setMsg('획순이나 모양이 달라요. 다시 써 보세요.', 'bad'); } },
            onComplete: () => quizFrom(k + 1, tk),
          });
        };
        const startQuiz = () => {
          stop(); finished = false; mistakes = 0; done.disabled = true;
          const tk = token;
          writers.forEach((w) => { try { w.hideCharacter(); if (outline) w.showOutline(); } catch (e) { /* ignore */ } });
          quizFrom(0, tk);
        };
        const animateAll = (k, tk) => {
          if (tk !== token || !alive()) return;
          if (k >= writers.length) { setMsg('이제 직접 써 보세요. ✍ 처음부터 쓰기를 누르세요.'); return; }
          cells.forEach((c, n) => c.classList.toggle('active', n === k));
          writers[k].animateCharacter({ onComplete: () => animateAll(k + 1, tk) });
        };
        document.getElementById('hw-anim').onclick = () => {
          stop(); const tk = token; done.disabled = true;
          writers.forEach((w) => { try { w.hideCharacter(); } catch (e) { /* ignore */ } });
          setMsg('획순을 보여 드릴게요.');
          animateAll(0, tk);
        };
        document.getElementById('hw-redo').onclick = startQuiz;
        document.getElementById('hw-hint').onclick = (e) => {
          outline = !outline;
          writers.forEach((w) => { try { outline ? w.showOutline() : w.hideOutline(); } catch (err) { /* ignore */ } });
          e.currentTarget.textContent = outline ? '윤곽 숨기기' : '윤곽 보이기';
        };
        hint.textContent = `${i + 1} / ${st.items.length} · 윤곽을 보고 획순대로 한 획씩 써 보세요. 모르겠으면 ▶ 획순 보기를 먼저 눌러 보세요.`;
        trace.setWidth = null;       // 굵기 변경 시 다시 그리기
        trace.stop = stop;
        startQuiz();
      }).catch(() => { if (alive()) fallback('획순 연습은 인터넷 연결이 필요해요. (회사 보안으로 막혔을 수 있어요)'); });
    };

    const trace = { setWidth: null, stop: null };
    const fallback = (why) => {
      pen().mode = 'free'; mark(); mountFree();
      hint.textContent = why + ' 자유 쓰기로 연습하세요. ' + hint.textContent;
    };
    const mount = () => {
      if (trace.stop) { try { trace.stop(); } catch (e) { /* ignore */ } }
      trace.stop = null; trace.setWidth = null;
      mark();
      if (pen().mode === 'order') mountOrder(); else mountFree();
    };
    document.querySelectorAll('[data-mode]').forEach((b) => {
      b.onclick = () => { if (pen().mode === b.dataset.mode) return; pen().mode = b.dataset.mode; save(); mount(); };
    });
    document.querySelectorAll('[data-pen]').forEach((b) => {
      b.onclick = () => {
        pen().w = b.dataset.pen; save(); mark();
        if (trace.setWidth) trace.setWidth(pen().w);   // 자유 쓰기: 바로 적용
        else if (pen().mode === 'order') mount();      // 획순 쓰기: 굵기를 바꾸면 이 글자를 처음부터
      };
    });
    mount();
  };
  show();
}

function stepTypePinyin(st, next) {
  // 한자를 보고 쓰기 / 뜻을 보고 쓰기를 번갈아 낸다
  const qs = shuffle(st.items).map((it, k) => ({ it, mode: k % 2 === 0 ? 'hz' : 'ko', attempts: 0, solved: false, msg: '', value: '' }));
  let i = 0, score = 0;
  const missed = [];

  const show = () => {
    if (i >= qs.length) return result();
    const q = qs[i];
    const it = q.it;
    const hz = q.mode === 'hz';
    app.innerHTML = frame(`
      <p class="hint">${i + 1} / ${qs.length} · ${hz ? '한자를 보고 병음을 쓰세요.' : '뜻을 보고 병음을 쓰세요. (한자 입력기가 있다면 한자로 써도 정답입니다.)'}
        성조는 nǐ 처럼 써도 되고 ni3 처럼 숫자로 써도 됩니다.</p>
      <div class="card big">
        ${hz ? `<div class="hanzi">${esc(it.zh)}</div>` : `<div class="ko big">${esc(it.ko)}</div>`}
        <button class="icon" data-say="${esc(it.zh)}" aria-label="듣기">🔊</button>
      </div>
      <form id="t-form" class="type-row" autocomplete="off">
        <input id="t-in" type="text" value="${esc(q.value)}" placeholder="병음 입력" ${q.solved ? 'disabled' : ''}
          autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="done">
        ${q.solved ? '' : '<button type="submit" class="primary">확인</button>'}
      </form>
      ${q.solved ? '' : `<details class="tones" open><summary>성조 입력 도우미</summary>
        <div class="tonepad">${TONE_GROUPS.map((gp) => `<span class="tg">${[...gp].map((ch) =>
          `<button type="button" class="tone" data-ins="${ch}">${ch}</button>`).join('')}</span>`).join('')}</div></details>`}
      <p class="build-msg ${q.solved ? 'good' : q.msg ? 'bad' : ''}">${q.msg}</p>
      ${q.solved ? `<div class="center"><span class="hanzi sm">${esc(it.zh)}</span> <span class="py">${esc(it.py)}</span>
        <button class="icon" data-say="${esc(it.zh)}">🔊</button><div class="ko">${esc(it.ko)}</div></div>` : ''}
      <div class="row">${q.solved
        ? `<button id="t-next" class="primary">${i + 1 < qs.length ? '다음 →' : '결과 보기 →'}</button>`
        : (q.attempts >= 2 ? '<button id="t-reveal">정답 보기</button>' : '')}</div>`);

    const input = document.getElementById('t-in');
    if (!q.solved) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      document.getElementById('t-form').onsubmit = (e) => {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;
        q.value = val;
        const res = judgePinyin(val, it, q.mode);
        if (q.attempts === 0) { // 첫 시도 결과만 점수·복습 카드에 반영
          grade(it, res === 'ok');
          if (res === 'ok') score++; else missed.push(q);
        }
        if (res === 'ok') {
          q.solved = true;
          q.msg = q.attempts === 0 ? '정답입니다! 👏' : '정답입니다.';
        } else {
          q.attempts++;
          q.msg = res === 'tone' ? '글자는 맞아요! 성조를 다시 확인해 보세요.' : '아쉬워요. 다시 써 보세요.';
        }
        show();
      };
      app.querySelectorAll('[data-ins]').forEach((b) => {
        b.onmousedown = (e) => e.preventDefault(); // 버튼을 눌러도 입력칸 포커스 유지
        b.onclick = () => {
          const s = input.selectionStart == null ? input.value.length : input.selectionStart;
          const e2 = input.selectionEnd == null ? s : input.selectionEnd;
          input.value = input.value.slice(0, s) + b.dataset.ins + input.value.slice(e2);
          input.focus();
          input.setSelectionRange(s + 1, s + 1);
        };
      });
    }
    const rv = document.getElementById('t-reveal');
    if (rv) rv.onclick = () => { q.solved = true; q.msg = '정답을 확인했습니다. 소리 내어 읽어 보세요.'; show(); };
    const nx = document.getElementById('t-next');
    if (nx) nx.onclick = () => { i++; show(); };
  };

  const result = () => {
    markDone(st);
    const review = missed.length
      ? `<h3>다시 볼 단어</h3>${missed.map((q) => `<div class="example">
          <span class="hanzi sm">${esc(q.it.zh)}</span> <button class="icon" data-say="${esc(q.it.zh)}">🔊</button>
          <div class="py">${esc(q.it.py)}</div><div class="ko">${esc(q.it.ko)}</div></div>`).join('')}`
      : '';
    app.innerHTML = frame(`<div class="center"><h2>${score} / ${qs.length}</h2>
      <p class="muted">${score === qs.length ? '완벽해요! 👏' : '틀린 단어는 복습 카드로 다시 나옵니다.'}</p></div>
      ${review}
      <div class="row"><button id="nx" class="primary">계속 →</button></div>`);
    document.getElementById('nx').onclick = next;
  };
  show();
}

/* ============ 문장 만들기 (6일차 주간 점검) ============ */
const BUILD_QUESTIONS = 10;   // 한 번에 푸는 문제 수
const BUILD_DISTRACTORS = 2;  // 정답 단어 외에 섞어 넣는 '함정' 단어 수 (0이면 정답 단어만 나열)
const BUILD_MIN = 3;          // 단어가 이보다 적은 문장은 문제로 쓰지 않음
const BUILD_MAX = 12;         // 단어가 이보다 많은 문장도 제외
const EXTRA_WORDS = ['金敏', '王明']; // 단어장에는 없지만 한 덩어리로 다룰 말(이름 등)
const NUMERAL = /^[零一二三四五六七八九十百]+$/;
const PUNCT = /[，。！？、：；,.!?:;\s]+/;

// 이 주차까지 배운 단어 모음: 문장을 단어로 끊고, 함정 단어를 고르는 데 쓴다
async function cumulativeLex(w) {
  const words = [];
  for (let n = 1; n <= w; n++) {
    const d = await getJSON(weekPath(n));
    if (d) d.vocab.forEach((v) => words.push(v.zh));
  }
  const uniq = [...new Set(words)];
  const set = new Set([...uniq, ...EXTRA_WORDS]);
  return { words: uniq, set, maxLen: Math.max(...[...set].map((x) => x.length)) };
}

// 문장을 '배운 단어' 단위로 끊는다. 가장 긴 단어부터 맞춰 보고, 없으면 글자 하나로 둔다.
// 이어진 숫자(十一, 二十五 …)는 한 덩어리로 묶는다.
// 데이터에 "tokens": ["我","是","学生"] 처럼 직접 적어 두면 그것을 우선한다.
function lineTokens(line, lex) {
  const clauses = line.zh.split(PUNCT).filter(Boolean);
  if (Array.isArray(line.tokens) && line.tokens.join('') === clauses.join('')) return line.tokens.slice();
  const out = [];
  for (const clause of clauses) {
    const part = [];
    for (let i = 0; i < clause.length;) {
      let hit = clause[i];
      for (let L = Math.min(lex.maxLen, clause.length - i); L > 1; L--) {
        const cand = clause.substr(i, L);
        if (lex.set.has(cand)) { hit = cand; break; }
      }
      part.push(hit);
      i += hit.length;
    }
    const merged = [];
    for (const t of part) {
      if (merged.length && NUMERAL.test(t) && NUMERAL.test(merged[merged.length - 1])) merged[merged.length - 1] += t;
      else merged.push(t);
    }
    out.push(...merged);
  }
  return out;
}

function buildQuestions(data, lex) {
  const seen = new Set();
  const cands = [];
  for (const l of [...data.sentences, ...data.dialogue]) {
    if (seen.has(l.zh)) continue;
    seen.add(l.zh);
    const tokens = lineTokens(l, lex);
    if (tokens.length >= BUILD_MIN && tokens.length <= BUILD_MAX) cands.push({ line: l, tokens });
  }
  return shuffle(cands).slice(0, BUILD_QUESTIONS).map((q) => {
    const extra = shuffle(lex.words.filter((w) => !q.tokens.includes(w))).slice(0, BUILD_DISTRACTORS);
    const items = [...q.tokens, ...extra].map((t) => ({ t }));
    let bank, tries = 0;
    do { bank = shuffle(items); tries++; } while (tries < 8 && bank.map((b) => b.t).join('|') === q.tokens.join('|'));
    return { ...q, bank, picked: [], attempts: 0, solved: false, pyShown: false, checked: null, msg: '' };
  });
}

function stepBuild(st, next) {
  const qs = buildQuestions(st.data, session.lex);
  if (!qs.length) return next();
  let i = 0, score = 0;
  const missed = [];

  const show = () => {
    if (i >= qs.length) return result();
    const q = qs[i];
    const target = q.tokens.join('');
    const used = new Set(q.picked);
    const $ = (id) => document.getElementById(id);

    app.innerHTML = frame(`
      <p class="hint">${i + 1} / ${qs.length} · 뜻에 맞게 단어를 순서대로 눌러 문장을 만드세요. 정답에 쓰이지 않는 함정 단어가 ${BUILD_DISTRACTORS}개 섞여 있습니다.</p>
      <div class="card big">
        <div class="ko big">${esc(q.line.ko)}</div>
      </div>
      <div class="answer">${q.picked.length
        ? q.picked.map((k, pos) => `<button class="chip ${q.checked ? (q.checked[pos] ? 'ok' : 'bad') : ''}" data-a="${pos}" ${q.solved ? 'disabled' : ''}>${esc(q.bank[k].t)}</button>`).join('')
        : '<span class="muted">아래 단어를 눌러 여기에 문장을 만드세요</span>'}</div>
      <div class="bank">${q.bank.map((b, k) =>
        `<button class="chip ${used.has(k) ? 'used' : ''}" data-b="${k}" ${used.has(k) || q.solved ? 'disabled' : ''}>${esc(b.t)}</button>`).join('')}</div>
      <p class="build-msg ${q.solved ? 'good' : q.msg ? 'bad' : ''}">${q.msg}</p>
      ${q.solved ? `<div class="center solved-row"><span class="hanzi sm">${esc(q.line.zh)}</span> <button class="icon" data-say="${esc(q.line.zh)}">🔊</button> <button id="b-py" class="icon">${q.pyShown ? '병음 숨기기' : '병음 힌트 보기'}</button></div>
        ${q.pyShown ? `<div class="py center">${esc(q.line.py)}</div>` : ''}` : ''}
      <div class="row">
        ${q.solved
          ? `<button id="b-next" class="primary">${i + 1 < qs.length ? '다음 문제 →' : '결과 보기 →'}</button>`
          : `<button id="b-undo" ${q.picked.length ? '' : 'disabled'}>← 하나 지우기</button>
             <button id="b-reset" ${q.picked.length ? '' : 'disabled'}>모두 지우기</button>
             <button id="b-check" class="primary" ${q.picked.length ? '' : 'disabled'}>확인</button>
             ${q.attempts >= 2 ? '<button id="b-reveal">정답 보기</button>' : ''}`}
      </div>`);

    const touch = () => { q.checked = null; q.msg = ''; };
    app.querySelectorAll('[data-b]').forEach((b) => { b.onclick = () => { touch(); q.picked.push(+b.dataset.b); show(); }; });
    app.querySelectorAll('[data-a]').forEach((b) => { b.onclick = () => { touch(); q.picked.splice(+b.dataset.a, 1); show(); }; });
    if ($('b-py')) $('b-py').onclick = () => { q.pyShown = !q.pyShown; show(); };
    if ($('b-undo')) $('b-undo').onclick = () => { touch(); q.picked.pop(); show(); };
    if ($('b-reset')) $('b-reset').onclick = () => { touch(); q.picked = []; show(); };
    if ($('b-check')) $('b-check').onclick = () => {
      const got = q.picked.map((k) => q.bank[k].t);
      if (got.join('') === target) {
        q.solved = true;
        q.checked = got.map(() => true);
        if (q.attempts === 0) { score++; q.msg = '정답입니다! 👏'; }
        else { missed.push(q); q.msg = '정답입니다. (처음에 틀려서 점수에는 포함되지 않아요)'; }
      } else {
        q.attempts++;
        q.checked = got.map((t, p) => t === q.tokens[p]);
        q.msg = `아쉬워요. 초록색은 자리가 맞는 단어, 빨간색은 다시 생각해 볼 단어입니다.${q.attempts >= 2 ? ' 막히면 ‘정답 보기’를 눌러도 됩니다.' : ''}`;
      }
      show();
    };
    if ($('b-reveal')) $('b-reveal').onclick = () => {
      const taken = new Set();
      q.picked = q.tokens.map((t) => {
        const k = q.bank.findIndex((b, idx) => b.t === t && !taken.has(idx));
        taken.add(k);
        return k;
      });
      q.solved = true;
      q.checked = q.picked.map(() => true);
      q.msg = '정답을 확인했습니다. 소리 내어 한 번 읽어 보세요.';
      missed.push(q);
      show();
    };
    if ($('b-next')) $('b-next').onclick = () => { i++; show(); };
  };

  const result = () => {
    const pct = Math.round((score / qs.length) * 100);
    session.checkScore = pct;
    markDone(st);
    const review = missed.length
      ? `<h3>다시 볼 문장</h3>${missed.map((q) => `<div class="example">
          <span class="hanzi sm">${esc(q.line.zh)}</span> <button class="icon" data-say="${esc(q.line.zh)}">🔊</button>
          <div class="py">${esc(q.line.py)}</div><div class="ko">${esc(q.line.ko)}</div></div>`).join('')}`
      : '';
    app.innerHTML = frame(`<div class="center"><h2>${score} / ${qs.length} (${pct}점)</h2>
      <p class="muted">${pct >= 80 ? '훌륭해요! 👏' : '틀린 문장은 아래에서 다시 읽어 보세요.'}</p></div>
      ${review}
      <div class="row"><button id="nx" class="primary">계속 →</button></div>`);
    document.getElementById('nx').onclick = next;
  };
  show();
}

// 학습 도중 돌아가기: 미리 보기/다시 학습은 바로 차시 화면으로, 오늘 진도 학습은 확인 후 홈으로
// 아직 끝내지 않은 일차가 있는데 그 뒤 일차를 열려고 할 때 경고
async function warnIncomplete(target) {
  const c = S.cursor, cw = weekOf(c), cd = dayOf(c);
  const data = await getJSON(weekPath(cw));
  const prog = S.progress && S.progress.cursor === c ? S.progress.done : [];
  const left = data ? buildSteps(data, DAY_TYPES[cd], false, false).filter((x) => !prog.includes(x.kind)).map((x) => x.title) : [];
  const msg = `⚠️ ${cw}주차 ${cd + 1}일차(${DAY_TYPES[cd].label})를 아직 마치지 않았어요.\n` +
    (left.length ? `남은 단계: ${left.join(' · ')}\n` : '') +
    `\n각 일차의 모든 단계를 완료해야 다음 일차로 넘어갈 수 있고 진척률에 반영됩니다.\n\n[확인] 지금 일차를 이어서 학습\n[취소] 선택한 일차를 미리 보기만 하기(진척률 미반영)`;
  return (await askConfirm(msg)) ? startSession(false) : startSession(false, target);
}

async function exitSession() {
  if (!session) return go('home');
  const { free, week } = session;
  if (free) return renderWeek(week);
  if (!(await askConfirm('학습을 중단하고 홈으로 돌아갈까요?\n(완료한 단계는 저장되며, 모든 단계를 마쳐야 오늘 진도에 반영됩니다)'))) return;
  go('home');
}

function finish() {
  const { practice, free, week } = session;
  if (!practice && !free) {
    if (session.type.id === 'check' && session.checkScore !== null) S.checks[week] = session.checkScore;
    S.completed[todayStr()] = (Number(S.completed[todayStr()]) || 0) + 1;
    S.cursor++;
    S.progress = null;
    save();
  }
  if (typeof cloudSync === 'function') {
    cloudSync({ kind: practice ? 'practice' : free ? 'free' : 'real', week, day: session.type.id, dayNo: (practice || free) ? null : ((S.cursor - 1) % DAYS_PER_WEEK) + 1, score: session.checkScore });
  }
  const title = practice ? '복습 완료! 👍' : free ? '학습 완료! 👍' : '오늘 학습 완료! 🎉';
  const todayN = Number(S.completed[todayStr()]) || 0;
  const more = !practice && !free && S.cursor < TOTAL_SESSIONS;
  const note = free ? '<p class="muted">현재 진도가 아닌 차시여서 진척률에는 반영되지 않았습니다.</p>'
    : practice ? '' : `<p>연속 학습 <b>${streak()}일</b> · 오늘 <b>${todayN}일차</b> 완료</p>`;
  app.innerHTML = `<section class="panel center">
    <h2>${title}</h2>
    ${note}
    <div class="row">
      ${free ? '<button id="toweek">차시 화면으로</button>' : ''}
      ${more ? '<button id="again">다음 일차 이어서 학습 →</button>' : ''}
      <button id="home" class="primary">홈으로</button>
    </div>
  </section>`;
  document.getElementById('home').onclick = () => go('home');
  const tw = document.getElementById('toweek');
  if (tw) tw.onclick = () => renderWeek(week);
  const ag = document.getElementById('again');
  if (ag) ag.onclick = () => startSession(false);
  session = null;
}

/* ============ 화면: 로드맵 / 기록 / 녹음 ============ */
// 주차별 제목(theme) 모으기: 로드맵 툴팁에 사용
async function loadThemes() {
  const themes = {};
  for (let n = 1; n <= TOTAL_WEEKS; n++) {
    const d = await getJSON(weekPath(n));
    if (d) themes[n] = d.theme;
    else if (!window.CN_DATA) break; // 파일 방식에서는 주차가 이어져 있으므로 첫 빈 주차에서 멈춤
  }
  return themes;
}

async function renderRoadmap() {
  const tk = ++viewToken;
  hideTip();
  const themes = await loadThemes();
  if (tk !== viewToken) return;
  const cur = Math.min(weekOf(S.cursor), TOTAL_WEEKS);
  const cells = Array.from({ length: TOTAL_WEEKS }, (_, k) => {
    const n = k + 1;
    const tip = `${n}주차 · ${themes[n] || '준비 중'}${n === cur ? ' (현재)' : ''}`;
    return `<button class="cell ${n < cur ? 'done' : n === cur ? 'now' : ''}" data-week="${n}" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${n}</button>`;
  }).join('');
  app.innerHTML = `
    <section class="panel">
      <h2>2년 로드맵 (${cur} / ${TOTAL_WEEKS}주차)</h2>
      ${curriculum.stages.map((s) => `<div class="stage-item">
        <b>${esc(s.title)}</b> <span class="stage">${esc(s.hsk)} · ${s.from}~${s.to}주차</span>
        <div class="muted">${esc(s.goal)}</div></div>`).join('')}
    </section>
    <section class="panel">
      <p class="hint">주차 번호에 마우스를 올리면 제목이 보이고, 누르면 해당 차시로 이동합니다.</p>
      <div class="cells">${cells}</div>
    </section>`;
}

async function renderStats() {
  const tk = ++viewToken;
  let recCount = '-';
  try { recCount = (await listRecs()).length; } catch (e) { /* 녹음 저장소 사용 불가 */ }
  if (tk !== viewToken) return;
  const cards = Object.values(S.srs);
  const mastered = cards.filter((c) => c.box >= 3).length;
  const checks = Object.entries(S.checks).sort((a, b) => a[0] - b[0]);
  app.innerHTML = `
    <section class="panel">
      <h2>학습 기록</h2>
      <div class="stats-row">
        <div class="stat"><b>${streak()}</b>연속 학습일</div>
        <div class="stat"><b>${Object.keys(S.completed).length}</b>총 학습일</div>
        <div class="stat"><b>${cards.length}</b>배운 단어</div>
        <div class="stat"><b>${mastered}</b>익숙한 단어</div>
        <div class="stat"><b>${recCount}</b>녹음</div>
      </div>
      <h2>주간 점검 점수</h2>
      ${checks.length ? checks.map(([w, p]) => `<div>${w}주차: <b>${p}점</b></div>`).join('') : '<p class="muted">아직 주간 점검 기록이 없습니다.</p>'}
    </section>
    <section class="panel">
      <h2>학습 기록 백업 · 복원</h2>
      <p class="hint">앱 파일을 새로 덮어써도 같은 브라우저(Chrome/Edge)에서 열면 기록은 그대로 남습니다. 다만 브라우저 방문 기록·사이트 데이터를 지우거나 다른 브라우저·PC로 옮길 때를 대비해 가끔 백업해 두세요.</p>
      <div class="row">
        <button id="bk-out">⬇ 백업 파일 저장 (진도 + 녹음)</button>
        <button id="bk-in">⬆ 백업에서 복원</button>
        <input type="file" id="bk-file" accept=".json,application/json" hidden>
      </div>
      <textarea id="bk-text" rows="3" placeholder="백업 내용이 여기에 표시됩니다. 파일 저장이 안 되는 화면(일부 휴대폰 앱)에서는 이 내용을 복사해 두었다가, 복원할 때 여기에 붙여 넣고 '복원'을 누르세요." spellcheck="false"></textarea>
      <p class="build-msg" id="bk-msg"></p>
    </section>
    <section class="panel">
      <button id="reset">진도 초기화</button>
      <p class="hint">진도 초기화는 학습 기록만 지우며, 녹음은 '녹음' 탭에서 따로 삭제합니다.</p>
    </section>`;
  const bkMsg = (t, cls) => { const m = document.getElementById('bk-msg'); m.textContent = t; m.className = 'build-msg ' + (cls || ''); };
  document.getElementById('bk-out').onclick = async () => {
    try {
      const recs = [];
      for (const r of await listRecs().catch(() => [])) {
        const { id, blob, ...rest } = r;
        recs.push({ ...rest, type: blob.type, data: await blobToDataURL(blob) });
      }
      const json = JSON.stringify({ app: 'cn-study', version: 1, saved: new Date().toISOString(), state: S, recs });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = `중국어학습-백업-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      document.getElementById('bk-text').value = json;
      bkMsg(`백업 파일을 저장했습니다. (진도 ${S.cursor}일차 완료, 녹음 ${recs.length}개)`, 'good');
    } catch (e) { bkMsg('백업에 실패했습니다: ' + e.message, 'bad'); }
  };
  const doRestore = async (text) => {
    try {
      const b = JSON.parse(text);
      if (b.app !== 'cn-study' || !b.state) throw new Error('이 앱의 백업 파일이 아닙니다.');
      if (!(await askConfirm(`백업(${b.saved ? b.saved.slice(0, 10) : '날짜 미상'}, ${b.state.cursor}일차 완료)으로 복원할까요?\n현재 학습 기록은 백업 내용으로 바뀌고, 백업의 녹음이 추가됩니다.`))) return;
      S = Object.assign(defaultState(), migrateState(b.state));
      save();
      let n = 0;
      for (const r of b.recs || []) {
        const { data, type, ...rest } = r;
        await saveRec({ ...rest, blob: await (await fetch(data)).blob() }); n++;
      }
      bkMsg(`복원했습니다. (진도 ${S.cursor}일차, 녹음 ${n}개 추가)`, 'good');
    } catch (err) { bkMsg('복원에 실패했습니다: ' + err.message, 'bad'); }
  };
  document.getElementById('bk-in').onclick = () => {
    const t = document.getElementById('bk-text').value.trim();
    if (t) doRestore(t); else document.getElementById('bk-file').click();
  };
  document.getElementById('bk-file').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) doRestore(await f.text());
  };
  document.getElementById('reset').onclick = async () => {
    if (await askConfirm('모든 학습 기록을 지우고 처음부터 시작할까요? (녹음은 유지됩니다)')) {
      S = defaultState();
      save();
      go('home');
    }
  };
}

function lineInfo(week, zh) {
  const d = cache[weekPath(week)];
  if (!d) return null;
  return [...d.sentences, ...d.dialogue].find((l) => l.zh === zh) || null;
}

async function renderRecordings() {
  const tk = ++viewToken;
  stopRec();
  session = null;
  let recs = [], err = '';
  try {
    recs = await listRecs();
  } catch (e) {
    err = '<p class="muted">이 브라우저에서는 녹음 보관함을 사용할 수 없습니다. (시크릿 모드이거나 저장이 차단되어 있을 수 있습니다)</p>';
  }
  const byWeek = {};
  recs.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  const weeks = Object.keys(byWeek).map(Number).sort((a, b) => a - b);
  await Promise.all(weeks.map((w) => getJSON(weekPath(w))));
  if (tk !== viewToken) return;

  const groups = weeks.map((w) => {
    const bySentence = {};
    byWeek[w].forEach((r) => { (bySentence[r.zh] = bySentence[r.zh] || []).push(r); });
    const theme = cache[weekPath(w)] ? ' · ' + esc(cache[weekPath(w)].theme) : '';
    const items = Object.entries(bySentence).map(([zh, list]) => {
      const info = lineInfo(w, zh);
      list.sort((a, b) => b.created - a.created);
      return `<div class="rec-group">
        <div><span class="hanzi sm">${esc(zh)}</span> <button class="icon" data-say="${esc(zh)}">🔊</button></div>
        ${info ? `<div class="py">${esc(info.py)}</div><div class="ko">${esc(info.ko)}</div>` : ''}
        ${list.map(recItemHTML).join('')}
      </div>`;
    }).join('');
    return `<h3 class="rec-week">${w}주차${theme}</h3>${items}`;
  }).join('');

  app.innerHTML = `<section class="panel" id="recview">
    <h2>녹음 보관함 <span class="muted small">(${recs.length}개)</span></h2>
    <p class="hint">녹음은 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 사라지니, 보관할 녹음은 ⬇로 파일에 저장해 두세요.</p>
    ${err}
    ${groups || '<p class="muted">아직 녹음이 없습니다. 차시 화면이나 오늘의 ‘핵심 문장’에서 ⏺ 녹음을 눌러 보세요.</p>'}
  </section>`;
}

app.addEventListener('click', (e) => {
  const say = e.target.closest('[data-say]');
  if (say) return speak(say.dataset.say);

  if (e.target.closest('[data-exit]')) return exitSession();

  const stp = e.target.closest('[data-step]');
  if (stp && session) {
    const k = +stp.dataset.step;
    if (k !== session.i) { session.i = k; renderStep(); }
    return;
  }

  const rvb = e.target.closest('[data-rv]');
  if (rvb) {
    const scope = rvb.closest('.rv-line, .example');
    const body = scope.querySelector(`[data-rvb="${rvb.dataset.rv}"]`);
    body.hidden = !body.hidden;
    rvb.classList.toggle('on', !body.hidden);
    rvb.setAttribute('aria-expanded', String(!body.hidden));
    return;
  }

  const wk = e.target.closest('[data-week]');
  if (wk) return renderWeek(+wk.dataset.week);

  const day = e.target.closest('[data-day]');
  if (day) {
    if (day.disabled) return;
    const page = day.closest('[data-weekpage]');
    const target = { week: +page.dataset.weekpage, day: +day.dataset.day };
    if ((target.week - 1) * DAYS_PER_WEEK + target.day > S.cursor) return warnIncomplete(target);
    return startSession(false, target);
  }

  const rec = e.target.closest('[data-rec]');
  if (rec) return toggleRec(rec);

  const del = e.target.closest('[data-delrec]');
  if (del) {
    askConfirm('이 녹음을 삭제할까요?').then((ok) => { if (ok) deleteRec(+del.dataset.delrec).then(refreshRecUI).catch(() => {}); });
    return;
  }

  const mic = e.target.closest('[data-mic]');
  if (mic) {
    const line = mic.closest('.line');
    const out = line.querySelector('.mic-result');
    out.textContent = '듣는 중…';
    listen((heard, err) => {
      if (err) { out.textContent = err; return; }
      const score = similarity(heard, line.dataset.zh);
      out.textContent = score >= 0.8
        ? `✅ 좋아요! (인식: ${heard})`
        : `다시 한번 해 보세요. (인식: ${heard})`;
    });
  }
});

<script>
'use strict';
/* ============ 계정 · 진척 공유 (Firebase Auth + Firestore) ============
   - 설정(window.CN_CONFIG.firebase)이 없으면 아무 것도 하지 않는다.
   - 서버 연결이 막혀도 앱의 학습 기능은 그대로 동작한다(저장 실패는 무시).
   - 컬렉션
       public/{uid}              이름·진척률 등 '간단한 진척' (로그인한 모두가 읽기)
       private/{uid}             이메일·상세 상태 (본인·관리자만 읽기)
       private/{uid}/events/{id} 학습 이력 한 건씩 (본인·관리자만 읽기)
   ===================================================================== */
const CLOUD = { rooms: {}, scope: 'all', sort: 'pct', user: null, isAdmin: false, err: null, busy: false, msg: '', loading: false };
const FB_VER = '10.12.2';
const FB_SCRIPTS = ['app', 'auth', 'firestore'].map((n) => `https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}-compat.js`);

const cloudConfigured = () => !!(window.CN_CONFIG && window.CN_CONFIG.firebase && window.CN_CONFIG.firebase.apiKey);
const cloudEmailIsAdmin = (email) => !!email && (window.CN_CONFIG.admins || []).map((x) => String(x).toLowerCase()).includes(String(email).toLowerCase());

function cloudLoadScript(src) {
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = src; sc.onload = resolve; sc.onerror = () => reject(new Error('load ' + src));
    document.head.appendChild(sc);
  });
}
let cloudInitP = null;
function initCloud() {
  if (cloudInitP) return cloudInitP;
  cloudInitP = (async () => {
    if (!cloudConfigured()) throw new Error('not-configured');
    if (!window.firebase) { for (const u of FB_SCRIPTS) await cloudLoadScript(u); }
    if (!firebase.apps.length) firebase.initializeApp(window.CN_CONFIG.firebase);
    CLOUD.auth = firebase.auth(); CLOUD.db = firebase.firestore();
    CLOUD.auth.onAuthStateChanged((u) => cloudOnAuth(u));
    return true;
  })().catch((e) => { cloudInitP = null; CLOUD.err = e; throw e; });
  return cloudInitP;
}

const FRIENDLY = {
  'auth/email-already-in-use': '이미 가입된 이메일입니다. 로그인해 주세요.',
  'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
  'auth/weak-password': '비밀번호는 6자 이상으로 해 주세요.',
  'auth/user-not-found': '가입되지 않은 이메일입니다.',
  'auth/wrong-password': '비밀번호가 맞지 않습니다.',
  'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않습니다.',
  'auth/too-many-requests': '시도가 너무 많습니다. 잠시 후 다시 해 주세요.',
  'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
  'auth/unauthorized-domain': '이 주소가 Firebase 승인 도메인에 없습니다. FIREBASE-SETUP.md의 4번 단계를 확인하세요.',
  'permission-denied': '서버 접근 권한이 없습니다(Firestore 규칙을 확인하세요).',
};
const cloudErrText = (e) => FRIENDLY[e && e.code] || ('오류: ' + ((e && e.message) || e));

// 지금 상태에서 만든 '간단한 진척' 요약
function cloudSummary() {
  const dates = Object.keys(S.completed).sort();
  const sc = Object.values(S.checks || {}).filter((v) => typeof v === 'number');
  return {
    cursor: S.cursor,
    pct: Math.round(Math.min(100, (S.cursor / TOTAL_SESSIONS) * 100) * 10) / 10,
    week: Math.min(TOTAL_WEEKS, weekOf(S.cursor)),
    level: levelOfCursor(S.cursor),
    score: sc.length ? Math.round(sc.reduce((x, y) => x + y, 0) / sc.length) : null,
    streak: streak(),
    studyDays: dates.length,
    last: dates[dates.length - 1] || '',
  };
}

async function cloudPush(event) {
  const u = CLOUD.user; if (!u || !CLOUD.db) return;
  try {
    const sm = cloudSummary(), ts = firebase.firestore.FieldValue.serverTimestamp();
    const name = u.displayName || (u.email || '').split('@')[0];
    await CLOUD.db.doc(`public/${u.uid}`).set({ name, ...sm, updated: ts });
    await CLOUD.db.doc(`private/${u.uid}`).set({
      email: u.email || '', name, ...sm, checks: S.checks || {},
      state: { cursor: S.cursor, completed: S.completed, checks: S.checks || {}, progress: S.progress || null },
      updated: ts,
    }, { merge: true });
    for (const code of Object.keys(CLOUD.rooms || {})) {   // 내가 들어간 방에도 내 현황 갱신
      try { await CLOUD.db.doc(`rooms/${code}/members/${u.uid}`).set({ name, ...sm, checks: S.checks || {}, updated: ts }); } catch (e) { /* 방이 없어졌거나 권한 없음 */ }
    }
    if (event) await CLOUD.db.collection(`private/${u.uid}/events`).add({ ...event, at: Date.now(), ts, cursor: S.cursor });
    CLOUD.err = null;
  } catch (e) { CLOUD.err = e; }
}
// 학습 한 번이 끝날 때 app.js의 finish()가 호출한다
function cloudSync(event) { if (CLOUD.user) cloudPush(event); }

const cloudSkipped = () => { try { return sessionStorage.getItem('cn-login-skip') === '1'; } catch (e) { return false; } };
async function cloudOnAuth(u) {
  const first = !CLOUD.authSeen; CLOUD.authSeen = true;
  CLOUD.user = u || null;
  CLOUD.isAdmin = !!u && cloudEmailIsAdmin(u.email);
  if (u) {
    try {
      const snap = await CLOUD.db.doc(`private/${u.uid}`).get();
      const st = snap.exists ? (snap.data().state || null) : null;
      if (st && Number(st.cursor) > S.cursor && await askConfirm(`서버에 더 진행된 기록(${st.cursor}일차 완료)이 있습니다.\n이 기기에 불러올까요?\n(현재 이 기기: ${S.cursor}일차 완료)`)) {
        S.cursor = Number(st.cursor);
        S.completed = Object.assign({}, S.completed, st.completed || {});
        S.checks = Object.assign({}, S.checks, st.checks || {});
        S.progress = st.progress || null;
        save();
      }
    } catch (e) { CLOUD.err = e; }
    await cloudLoadRooms();
    await cloudPush({ kind: 'login' });
  } else { CLOUD.rooms = {}; }
  if (document.querySelector('nav button[data-view="cloud"].on')) renderCloud();
  // 앱을 처음 켰을 때: 로그인 정보가 없으면 로그인 화면을 먼저 보여 준다(이전에 로그인했다면 자동으로 이어짐)
  else if (first && !u && !cloudSkipped() && !session && document.querySelector('nav button[data-view="home"].on')) go('cloud');
}

const fmtTime = (ms) => { if (!ms) return '-'; const d = new Date(ms); const p = (n) => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
