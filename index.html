<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每天30分钟 중국어</title>
  <style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #ffffff;
  --text: #000000;
  --muted: #3d3d3d;
  --accent: #c8102e;
  --accent-soft: #fbe9ec;
  --good: #2e7d32;
  --bad: #c62828;
  --line: #d9d9d9;
  --soft: #f2f2f2;
  --mint: #e3f5e1;
  --mint-line: #b7dfb2;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans KR", "Noto Sans SC", sans-serif;
  line-height: 1.5;
}
header {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
h1 { margin: 0; font-size: 1.25rem; color: var(--accent); }
h1 small { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
nav { display: flex; gap: 4px; }
nav button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 48px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.center { text-align: center; }
h2 { margin: 0 0 8px; font-size: 1.15rem; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
.muted { color: var(--muted); }
.stage { color: var(--accent); font-weight: 600; font-size: 0.85rem; }
.plan { padding-left: 20px; margin: 12px 0; }
.plan li { margin: 4px 0; }
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
.stat { flex: 1 1 110px; background: var(--soft); border-radius: 12px; padding: 10px 12px; text-align: center; }
.stat b { display: block; font-size: 1.5rem; color: var(--accent); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.dot { font-size: 0.95rem; font-weight: 700; padding: 5px 13px; border: 0; border-radius: 999px; background: var(--soft); color: var(--muted); cursor: pointer; }
.dot:hover:not(:disabled) { outline: 2px solid var(--accent); }
.dot.done { background: var(--accent-soft); color: var(--accent); }
.dot.done::before { content: '✓ '; }
.dot.now { background: var(--accent); color: #fff; }

/* 눌러서 보기 */
.rv-btn { font-size: 0.95rem; font-weight: 700; padding: 4px 12px; margin: 6px 6px 0 0; border-style: dashed; color: var(--muted); border-radius: 999px; }
.rv-btn::after { content: ' ▾'; }
.rv-btn.on { color: var(--accent); border-color: var(--accent); border-style: solid; }
.rv-btn.on::after { content: ' ▴'; }
.rv-body { margin-top: 4px; }
.rv-base.ko.big { font-size: 1.2rem; }
button {
  font: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.6; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.good { border-color: var(--good); color: var(--good); }
button.bad { border-color: var(--bad); color: var(--bad); }
button.icon { padding: 5px 12px; font-size: 1.1rem; }
.row { display: flex; gap: 10px; justify-content: center; margin: 14px 0 0; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card {
  background: var(--soft);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}
.card.big { padding: 28px 16px; margin-bottom: 8px; min-height: 140px; }
.hanzi { font-size: 2rem; font-weight: 600; letter-spacing: 0.05em; }
.hanzi.sm { font-size: 1.4rem; }
.py { color: var(--accent); font-size: 0.95rem; }
.ko { color: var(--muted); font-size: 0.95rem; }
.ko.big { color: var(--text); font-size: 1.5rem; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font-size: 1.05rem; }
.opt.right { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.line {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.line .sp { color: var(--accent); width: 1.5em; }
.line .ctl { display: flex; gap: 6px; }
.mic-result { grid-column: 2 / 4; font-size: 0.85rem; color: var(--muted); }
.grammar { margin-bottom: 18px; }
.grammar h3 { margin: 0 0 4px; font-size: 1.05rem; }
.example { padding: 6px 0 6px 12px; border-left: 3px solid var(--accent-soft); margin: 8px 0; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; margin-top: 10px; }
.cell { font-size: 0.8rem; font-weight: 600; text-align: center; padding: 6px 0; border-radius: 6px; background: var(--soft); color: var(--muted); }
.cell.done { background: var(--accent-soft); color: var(--accent); }
.cell.now { background: var(--accent); color: #fff; font-weight: 700; }
.stage-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
.stage-item:last-child { border-bottom: 0; }
code { background: var(--soft); padding: 1px 6px; border-radius: 6px; }
.small { font-size: 0.8rem; }

/* 진척률 */
.prog-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.prog-pct { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.bar { height: 12px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; min-width: 0; transition: width 0.3s; }

/* 이전 / 현재 / 다음 차시 */
.lessons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lesson {
  display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
}
.lesson .lab { font-size: 0.75rem; color: var(--muted); }
.lesson b { font-size: 1.05rem; }
.lesson.now { border-color: var(--accent); background: var(--accent-soft); }
.lesson.off { opacity: 0.45; border-style: dashed; }
@media (max-width: 560px) { .lessons { grid-template-columns: 1fr; } }

/* 차시(주차) 화면 */
.days { list-style: none; padding: 0; margin: 12px 0; }
.day {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 10px; margin-bottom: 4px;
}
.day .dn { color: var(--muted); font-size: 0.85rem; }
.day.done .dn { color: var(--good); }
.day.now { background: var(--accent-soft); }

/* 로드맵 칸 (버튼) */
button.cell { border: 0; padding: 6px 0; border-radius: 6px; cursor: pointer; }
button.cell:hover { outline: 2px solid var(--accent); }

/* 녹음 */
button.rec { white-space: nowrap; }
button.recording { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.6; } }
.recs { grid-column: 2 / 4; }
.rec { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.rec audio { height: 34px; max-width: 100%; }
a.icon.dl {
  text-decoration: none; color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 4px 10px; background: var(--panel);
}
/* 단어 쓰기: 한자 따라 쓰기 / 병음 입력 */
.pad-wrap { display: flex; justify-content: center; margin: 12px 0; }
.pad { position: relative; background: var(--panel); border-radius: 8px; }
.pad canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#pad-draw { cursor: crosshair; }
.type-row { display: flex; gap: 8px; margin: 12px 0; }
.type-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
}
.type-row input:focus { outline: 2px solid var(--accent); }
.type-row input:disabled { opacity: 0.7; }
.tones { margin: 4px 0 8px; }
.tones summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
.tonepad { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; }
.tg { display: flex; gap: 4px; }
button.tone { padding: 4px 10px; font-size: 1.05rem; }

/* 정답 후 줄: 한자 · 🔊 · 병음 힌트 버튼을 한 줄에 유지 (긴 문장은 한자만 줄바꿈) */
.solved-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
.solved-row .hanzi { min-width: 0; overflow-wrap: anywhere; }
.solved-row button { flex-shrink: 0; white-space: nowrap; }
.solved-row #b-py { font-size: 0.9rem; padding: 4px 9px; }

/* 문장 만들기 */
.answer {
  min-height: 62px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px; margin-bottom: 12px; border: 2px dashed var(--line); border-radius: 12px;
}
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
.chip { font-size: 1.3rem; padding: 8px 16px; border-radius: 10px; }
.chip.used { opacity: 0.2; }
.chip.ok { background: var(--good); border-color: var(--good); color: #fff; }
.chip.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip:disabled.ok, .chip:disabled.bad { opacity: 1; }
.build-msg { min-height: 1.5em; margin: 6px 0; text-align: center; font-size: 0.95rem; }
.build-msg.good { color: var(--good); font-weight: 600; }
.build-msg.bad { color: var(--bad); }

/* 툴팁 / 학습 화면 돌아가기 */
#tip {
  position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 8px;
  font-size: 0.85rem; max-width: min(320px, calc(100vw - 16px)); opacity: 0; transition: opacity 0.1s;
}
#tip.on { opacity: 1; }
.sess-top { margin-bottom: 10px; }
.sess-top button { padding: 6px 14px; font-size: 1rem; color: var(--muted); }
.rec-week { margin: 18px 0 6px; color: var(--accent); }
.rec-group { padding: 10px 0; border-bottom: 1px solid var(--line); }

/* 획순 쓰기 / 펜 굵기 */
.seg { display: flex; gap: 0; margin: 10px 0; justify-content: center; }
.seg button { border-radius: 0; padding: 8px 14px; font-size: 1rem; }
.seg button:first-child { border-radius: 10px 0 0 10px; }
.seg button:last-child { border-radius: 0 10px 10px 0; margin-left: -1px; }
.seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pen-row { display: flex; gap: 6px; align-items: center; justify-content: center; margin: 10px 0 0; }
.pen-btn { padding: 4px 12px; font-size: 0.95rem; border-radius: 999px; }
.pen-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.hw-box { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.hw-cell {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); touch-action: none;
  background-image:
    linear-gradient(to right, transparent calc(50% - 0.5px), var(--line) calc(50% - 0.5px), var(--line) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
    linear-gradient(to bottom, transparent calc(50% - 0.5px), var(--line) calc(50% - 0.5px), var(--line) calc(50% + 0.5px), transparent calc(50% + 0.5px));
}
.hw-cell.active { border-color: var(--accent); }
.hw-cell svg { display: block; }

/* 앱 안 확인창 / 백업 입력칸 */
.modal-ov { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.45); }
.modal { background: var(--panel); color: var(--text); border-radius: 14px; padding: 18px; width: min(420px, 100%); border: 1px solid var(--line); }
.modal-msg { margin: 0 0 4px; white-space: pre-line; }
#bk-text { width: 100%; margin-top: 10px; font: inherit; font-size: 0.8rem; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--text); }

/* 정답/오답 알림 */
.toast { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 40; pointer-events: none;
  padding: 16px 28px; border-radius: 16px; font-size: 1.35rem; font-weight: 800; color: #fff; text-align: center;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25); animation: toast-in 0.15s ease-out; max-width: calc(100vw - 32px); }
.toast.good { background: var(--good); }
.toast.bad { background: var(--bad); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

.cgroup { margin: 18px 0 4px; font-size: 1.05rem; color: var(--accent); }

/* 화자 표시(A/B)가 없는 줄은 왼쪽 빈 칸을 없앤다 */
.line.nosp { grid-template-columns: 1fr auto; }
.line.nosp .mic-result, .line.nosp .recs { grid-column: 1 / 3; }

/* 계정·진척 현황 */
.cl-form { display: grid; gap: 12px; max-width: 420px; }
.cl-form label { display: grid; gap: 4px; font-weight: 600; }
.cl-form input { font: inherit; font-weight: 400; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.cl-form input:focus { outline: 2px solid var(--accent); }
.badge { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 700; font-size: 0.85rem; }
.tbl tr.me td { background: var(--accent-soft); font-weight: 700; }

/* 코너 칸(연한 초록) */
.line.nosp { background: var(--mint); border: 1px solid var(--mint-line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }

/* 3·4일차: 한 화면에 하나씩, 큰 글씨 */
.pg-count { text-align: center; color: var(--muted); font-weight: 700; margin: 4px 0 10px; }
.paged { min-height: 240px; display: flex; align-items: center; justify-content: center; }
.paged > * { width: 100%; }
.paged .line, .paged .line.nosp, .paged .line.rv-line { grid-template-columns: 1fr; text-align: center; justify-items: center; padding: 22px 14px; gap: 14px; }
.paged .line .sp { font-size: 1.2rem; width: auto; }
.paged .line .ctl, .paged .line.nosp .ctl { justify-content: center; flex-wrap: wrap; }
.paged .hanzi.sm { font-size: 2.6rem; line-height: 1.3; }
.paged .rv-base.ko.big { font-size: 1.9rem; line-height: 1.4; }
.paged .py { font-size: 1.4rem; }
.paged .rv-body.ko, .paged .ko { font-size: 1.3rem; }
.paged .rv-btn { font-size: 1.05rem; padding: 6px 16px; }
.paged .icon { font-size: 1.3rem; padding: 8px 16px; }
.paged .grammar h3 { font-size: 1.5rem; text-align: center; }
.paged .grammar > .hint { font-size: 1.1rem; color: var(--text); text-align: center; }
.paged .example { text-align: center; border-left: 0; background: var(--soft); border-radius: 12px; padding: 14px 10px; }
.pg-nav button { min-width: 120px; font-size: 1.1rem; }
.pg-nav button:disabled { opacity: 0.4; }
.paged .line .mic-result, .paged .line .recs { grid-column: 1 / -1; }

/* 대화문: 두 줄씩 */
.paged.two { display: block; min-height: 0; }
.paged.two .line, .paged.two .line.nosp, .paged.two .line.rv-line { padding: 14px 12px; gap: 8px; margin: 0 0 12px; }
.paged.two .hanzi.sm { font-size: 2rem; }
.paged.two .py { font-size: 1.15rem; }
.paged.two .rv-body.ko, .paged.two .ko { font-size: 1.1rem; }

/* 홈: 이전/현재/다음 차시 — 연한 노랑, 제목 파랑, 현재만 굵게 */
.lesson { background: #fff9c9; border-color: #ecdf8a; }
.lesson.now { background: #fff9c9; border-color: #d8c640; box-shadow: 0 0 0 2px #ecdf8a; }
.lesson .wt { color: #1558c0; font-weight: 400; }
.lesson .wk { color: #000; font-size: 1.05rem; font-weight: 400; }
.lesson.now .wk, .lesson.now .wt { font-weight: 700; }
.lesson .lab { color: #3d3d3d; font-weight: 400; }
.lesson.now .lab { font-weight: 700; }

/* 차시 칸: 가운데 정렬, 큰 글씨 */
.lesson { align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 16px 12px; }
.lesson .lab { font-size: 1.05rem; color: #000; }
.lesson .wt { font-size: 1.2rem; }
.lesson.off .wk { font-size: 1.2rem; }

/* 현재 칸: 검정 배경 + 굵은 흰 글씨 */
.lesson.now { background: #000; border-color: #000; box-shadow: none; }
.lesson.now .lab, .lesson.now .wt, .lesson.now .wk { color: #fff; font-weight: 700; }

/* 미니 퀴즈: 제시어 칸 초록, 보기 가운데 정렬·큰 글씨 */
.card.big:has(+ .opts) { background: #cfeccb; border: 1px solid #8fcf88; padding: 26px 14px; text-align: center; }
.card.big:has(+ .opts) .hanzi { font-size: 3.6rem; line-height: 1.25; }
.card.big:has(+ .opts) .ko.big { font-size: 2.3rem; line-height: 1.35; }
.opts { margin-top: 14px; }
.opt { text-align: center; font-size: 1.35rem; padding: 16px 10px; }
.stage { margin-bottom: 14px; }

/* 레벨 구간 진척 막대 */
.lvbar { display: flex; gap: 3px; height: 16px; margin: 8px 0 10px; }
.lvseg { border-radius: 6px; overflow: hidden; min-width: 8px; }
.lvseg > div { height: 100%; }
.lvlegend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
.lvcell { border: 2px solid; border-radius: 10px; padding: 6px 2px; text-align: center; display: grid; gap: 1px; opacity: 0.85; }
.lvcell b { font-size: 0.9rem; font-weight: 500; }
.lvcell small { font-size: 0.68rem; color: #333; }
.lvcell .lvi { font-size: 1.25rem; line-height: 1.2; }
.lvcell.now { opacity: 1; box-shadow: 0 0 0 2px #000; }
.lvcell.now b { font-weight: 800; }
/* 내 정보 */
.lv-card { display: flex; align-items: center; gap: 12px; border: 2px solid var(--lc); background: var(--lt); border-radius: 14px; padding: 10px 14px; margin: 8px 0 12px; }
.lv-card .lv-ic { font-size: 2.2rem; line-height: 1; }
.lv-card b { font-size: 1.3rem; color: var(--lc); }
.lv-card small { display: block; color: #333; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chips button { border-radius: 999px; padding: 6px 12px; font-size: 0.95rem; }
.chips button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.rk-me { font-weight: 700; margin: 6px 0; }
.room-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.room-row b { flex: 1 1 auto; }
.room-code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; background: var(--soft); padding: 3px 8px; border-radius: 8px; }
.cl-inline { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.cl-inline input { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); flex: 1 1 140px; min-width: 0; background: var(--panel); color: var(--text); }

</style>
</head>
<body>
  <header>
    <h1>每天30分钟 <small>중국어 회화</small></h1>
    <nav>
